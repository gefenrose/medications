<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="תרופות">
<meta name="theme-color" content="#b85c38">
<title>מעקב תרופות – דיור מוגן</title>
<!-- v4 -->
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap');
  :root {
    --primary: #b85c38;
    --primary-dark: #9a4a2c;
    --primary-light: #f5ede8;
    --primary-mid: #d4806a;
    --success: #4a7c59;
    --success-bg: #eef4f0;
    --skip: #8b3a3a;
    --skip-bg: #f5eaea;
    --pending-bg: #faf6f0;
    --bg: #f5f0ea;
    --bg2: #ede8e0;
    --card: #ffffff;
    --border: #ddd7ce;
    --border-light: #e8e2d9;
    --text: #2a2420;
    --text-secondary: #7a6e66;
    --text-muted: #a89e96;
    --shadow: 0 1px 4px rgba(0,0,0,0.06);
    --shadow-md: 0 2px 12px rgba(0,0,0,0.08);
    --radius: 14px;
    --radius-sm: 8px;
    --font: 'Heebo', 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); direction: rtl; min-height: 100vh; font-size: 15px; }

  .screen { display: none; min-height: 100vh; flex-direction: column; }
  .screen.active { display: flex; }

  /* LOGIN */
  #loginScreen { background: var(--bg); align-items: center; justify-content: center; padding: 2rem; }
  .login-box { background: var(--card); border-radius: 20px; padding: 2.5rem 2rem; width: 100%; max-width: 380px; border: 1px solid var(--border); box-shadow: var(--shadow-md); }
  .login-logo { text-align: center; margin-bottom: 2rem; }
  .login-logo .icon { font-size: 2.5rem; }
  .login-logo h1 { font-size: 1.5rem; font-weight: 700; color: var(--text); margin-top: .6rem; letter-spacing: -.01em; }
  .login-logo p { color: var(--text-secondary); font-size: 0.88rem; margin-top: .3rem; }
  .login-tabs { display: flex; gap: 6px; margin-bottom: 1.5rem; background: var(--bg); border-radius: 10px; padding: 4px; }
  .login-tab { flex: 1; padding: .55rem; border: none; background: transparent; border-radius: 8px; cursor: pointer; font-size: .9rem; font-family: var(--font); color: var(--text-secondary); transition: all .2s; font-weight: 500; }
  .login-tab.active { background: var(--primary); color: white; font-weight: 600; }
  .form-group { margin-bottom: 1.1rem; }
  .form-group label { display: block; font-size: .82rem; font-weight: 600; margin-bottom: .4rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .03em; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: .7rem 1rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: .95rem; font-family: var(--font); color: var(--text); background: var(--bg); direction: rtl; transition: border-color .2s, background .2s; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary-mid); background: white; }
  .btn-primary { width: 100%; padding: .8rem; background: var(--primary); color: white; border: none; border-radius: var(--radius-sm); font-size: .95rem; font-weight: 600; cursor: pointer; font-family: var(--font); transition: background .2s; letter-spacing: .01em; }
  .btn-primary:hover { background: var(--primary-dark); }
  .error-msg { color: var(--skip); font-size: .83rem; margin-top: .5rem; display: none; }

  /* TOPBAR */
  .topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: .85rem 1.4rem; display: flex; align-items: center; justify-content: space-between; gap: .5rem; position: sticky; top: 0; z-index: 100; }
  .topbar-title { font-size: 1rem; font-weight: 700; flex: 1; text-align: center; color: var(--text); }
  .topbar-user { text-align: left; line-height: 1.3; }
  .topbar-user strong { font-size: .95rem; color: var(--text); display: block; }
  .topbar-user span { font-size: .78rem; color: var(--text-secondary); }
  .topbar-btn { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); border-radius: var(--radius-sm); padding: .4rem .75rem; cursor: pointer; font-size: .82rem; font-family: var(--font); display: flex; align-items: center; gap: .3rem; transition: all .2s; white-space: nowrap; font-weight: 500; }
  .topbar-btn:hover { border-color: var(--primary-mid); color: var(--primary); }
  .topbar-btn.accent { background: var(--primary); border-color: var(--primary); color: white; }
  .topbar-btn.accent:hover { background: var(--primary-dark); }
  .topbar-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--primary-light); border: 2px solid var(--primary-mid); display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 700; color: var(--primary); flex-shrink: 0; cursor: default; }

  /* BOTTOM NAV */
  .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--card); border-top: 1px solid var(--border); display: flex; z-index: 99; padding-bottom: env(safe-area-inset-bottom); }
  .nav-btn { flex: 1; padding: .65rem .4rem .45rem; border: none; background: transparent; cursor: pointer; font-family: var(--font); font-size: .68rem; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 2px; transition: color .2s; font-weight: 500; }
  .nav-btn .nav-icon { font-size: 1.2rem; }
  .nav-btn.active { color: var(--primary); }

  .content { flex: 1; padding: 1.2rem; padding-bottom: 80px; overflow-y: auto; max-width: 700px; margin: 0 auto; width: 100%; }
  .content-wide { flex: 1; padding: 1.2rem; padding-bottom: 30px; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* CARDS */
  .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border-light); padding: 1.2rem; margin-bottom: .8rem; box-shadow: var(--shadow); }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: .8rem; }
  .card-title { font-size: .95rem; font-weight: 700; color: var(--text); }
  .card-subtitle { font-size: .78rem; color: var(--text-secondary); margin-top: .2rem; }

  /* BUTTONS */
  .btn { padding: .5rem 1rem; border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: .88rem; font-weight: 600; font-family: var(--font); transition: all .15s; }
  .btn-sm { padding: .3rem .7rem; font-size: .78rem; border-radius: 6px; }
  .btn-success { background: var(--success-bg); color: var(--success); border: 1px solid #b8d4c0; }
  .btn-success:hover { background: #ddeee3; }
  .btn-danger { background: var(--skip-bg); color: var(--skip); border: 1px solid #d4b0b0; }
  .btn-danger:hover { background: #ecdada; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
  .btn-outline:hover { border-color: var(--primary-mid); color: var(--primary); }
  .btn-orange { background: var(--primary); color: white; border: none; }
  .btn-orange:hover { background: var(--primary-dark); }
  .btn-icon { background: transparent; border: 1px solid var(--border-light); border-radius: 6px; padding: .28rem .48rem; cursor: pointer; font-size: .82rem; color: var(--text-muted); transition: all .15s; }
  .btn-icon:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary-mid); }

  /* BADGE */
  .badge { display: inline-flex; align-items: center; gap: .25rem; padding: .25rem .6rem; border-radius: 20px; font-size: .75rem; font-weight: 600; }
  .badge-given { background: var(--success-bg); color: var(--success); border: 1px solid #b8d4c0; }
  .badge-skipped { background: var(--skip-bg); color: var(--skip); border: 1px solid #d4b0b0; }
  .badge-pending { background: var(--pending-bg); color: var(--text-secondary); border: 1px solid var(--border); }

  /* ADMIN TABS */
  .admin-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--bg2); border-radius: 12px; padding: 4px; margin-bottom: 1.2rem; }
  .admin-tab { padding: .5rem .3rem; border: none; border-radius: 9px; cursor: pointer; font-size: .78rem; font-weight: 600; white-space: nowrap; background: transparent; color: var(--text-secondary); transition: all .2s; font-family: var(--font); display: flex; align-items: center; justify-content: center; gap: .25rem; text-align: center; }
  .admin-tab.active { background: var(--card); color: var(--text); box-shadow: var(--shadow); }

  /* SECTION */
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: .9rem; }
  .section-title { font-size: .88rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; }

  /* RESIDENT ROW */
  .resident-row { display: flex; align-items: center; gap: .8rem; padding: .9rem 1rem; border-radius: 12px; border: 1px solid var(--border-light); margin-bottom: .5rem; background: white; transition: all .2s; }
  .resident-row.given { border-color: #b8d4c0; background: var(--success-bg); }
  .resident-row.skipped { border-color: #d4b0b0; background: var(--skip-bg); }
  .resident-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 700; color: var(--primary); flex-shrink: 0; border: 1.5px solid var(--primary-mid); }
  .resident-info { flex: 1; }
  .resident-name { font-weight: 700; font-size: .92rem; color: var(--text); }
  .resident-meds { font-size: .75rem; color: var(--text-secondary); margin-top: .18rem; }
  .resident-actions { display: flex; gap: .35rem; flex-shrink: 0; align-items: center; }

  /* TOGGLE */
  .toggle-wrap { display: flex; align-items: center; gap: .5rem; }
  .toggle { position: relative; display: inline-block; width: 44px; height: 24px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: var(--border); border-radius: 24px; transition: .3s; }
  .toggle-slider:before { position: absolute; content: ""; height: 18px; width: 18px; right: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .3s; }
  input:checked + .toggle-slider { background: var(--primary); }
  input:checked + .toggle-slider:before { transform: translateX(-20px); }

  /* LIST ITEMS */
  .list-item { display: flex; align-items: center; gap: .8rem; padding: .85rem 1rem; background: white; border: 1px solid var(--border-light); border-radius: 12px; margin-bottom: .45rem; }
  .list-item-content { flex: 1; }
  .list-item-title { font-weight: 600; font-size: .9rem; color: var(--text); }
  .list-item-sub { font-size: .75rem; color: var(--text-secondary); margin-top: .15rem; }
  .list-item-actions { display: flex; gap: .3rem; }

  /* ROUND HEADER CARD */
  .round-card { background: var(--primary-light); border: 1px solid #dfc4b8; border-radius: var(--radius); padding: 1.1rem 1.3rem; margin-bottom: 1rem; }
  .round-card h2 { font-size: 1.2rem; font-weight: 700; color: var(--primary-dark); }
  .round-card p { font-size: .82rem; color: var(--text-secondary); margin-top: .2rem; }
  .round-card .time-badge { background: var(--primary); color: white; border-radius: 6px; padding: .25rem .65rem; font-size: .82rem; font-weight: 700; display: inline-block; margin-top: .5rem; }

  /* STATS */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin-bottom: 1rem; }
  .stat-card { background: white; border: 1px solid var(--border-light); border-radius: 10px; padding: .65rem; text-align: center; }
  .stat-num { font-size: 1.35rem; font-weight: 700; }
  .stat-label { font-size: .7rem; color: var(--text-muted); margin-top: .15rem; font-weight: 500; }

  /* HISTORY */
  .history-entry { border-right: 3px solid var(--primary-mid); padding-right: .8rem; margin-bottom: .7rem; }
  .history-date { font-size: .75rem; color: var(--text-muted); font-weight: 600; }
  .history-detail { font-size: .85rem; color: var(--text); margin-top: .15rem; }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(42,36,32,0.45); z-index: 200; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--card); border-radius: 20px 20px 0 0; padding: 1.4rem 1.4rem 2rem; width: 100%; max-width: 500px; max-height: 88vh; overflow-y: auto; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; padding-bottom: .8rem; border-bottom: 1px solid var(--border-light); }
  .modal-title { font-size: 1rem; font-weight: 700; color: var(--text); }
  .modal-close { background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: .35rem .55rem; cursor: pointer; font-size: .9rem; color: var(--text-secondary); line-height: 1; }

  /* EMPTY */
  .empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--text-muted); background: white; border-radius: var(--radius); border: 1px solid var(--border-light); }
  .empty-state .empty-icon { font-size: 2rem; margin-bottom: .6rem; opacity: .5; }
  .empty-state p { font-size: .88rem; }

  /* REMINDER */
  .reminder-card { background: white; border: 1px solid var(--border-light); border-radius: 12px; padding: .9rem 1rem; margin-bottom: .5rem; }
  .reminder-time { font-size: 1rem; font-weight: 700; color: var(--primary); }
  .reminder-list { font-size: .82rem; color: var(--text-secondary); margin-top: .35rem; line-height: 1.7; }

  /* MISC */
  .checkbox-group { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem; }
  .checkbox-item { display: none; }
  .med-pill { display: inline-flex; align-items: center; gap: .35rem; padding: .45rem .85rem; border-radius: 20px; border: 1.5px solid var(--border); background: white; cursor: pointer; font-size: .85rem; font-weight: 500; color: var(--text-secondary); transition: all .18s; user-select: none; -webkit-tap-highlight-color: transparent; min-height: 38px; }
  .med-pill.selected { background: var(--primary-light); border-color: var(--primary-mid); color: var(--primary-dark); font-weight: 700; }
  .med-pill.selected::before { content: "✓ "; font-size: .8rem; }
  .divider { height: 1px; background: var(--border-light); margin: .8rem 0; }
  .text-muted { color: var(--text-secondary); font-size: .83rem; }
  .mt-sm { margin-top: .5rem; }
  .mt-md { margin-top: 1rem; }
  .flex { display: flex; }
  .flex-center { display: flex; align-items: center; }
  .gap-sm { gap: .45rem; }
  .gap-md { gap: .8rem; }
  .justify-between { justify-content: space-between; }
  .w-full { width: 100%; }
  .font-bold { font-weight: 700; }
  .text-sm { font-size: .83rem; }
  select.full-select { width: 100%; padding: .6rem 1rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: .92rem; font-family: var(--font); direction: rtl; background: var(--bg); color: var(--text); }
  .info-box { background: var(--primary-light); border-radius: 10px; padding: .75rem 1rem; border-right: 3px solid var(--primary-mid); margin-bottom: .8rem; font-size: .85rem; color: var(--text-secondary); }
  .tag { display: inline-block; background: var(--primary-light); color: var(--primary-dark); padding: .18rem .55rem; border-radius: 20px; font-size: .75rem; font-weight: 600; margin: 2px; }
  .page-hint { text-align: center; padding: .8rem; font-size: .8rem; color: var(--text-muted); }
  .pill-tabs { display: flex; gap: 6px; margin-bottom: 1rem; }
  .pill-tab { padding: .45rem 1.1rem; border: 1.5px solid var(--border); border-radius: 20px; cursor: pointer; font-size: .85rem; font-weight: 600; background: white; color: var(--text-secondary); transition: all .2s; font-family: var(--font); }
  .pill-tab.active { background: var(--primary); color: white; border-color: var(--primary); }

  /* ===== MOBILE FIXES ===== */
  /* Touch targets — min 44px */
  .btn, .btn-sm, .nav-btn, .topbar-btn, .admin-tab, .login-tab, .pill-tab {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .btn { min-height: 44px; }
  .btn-sm { min-height: 38px; }
  .nav-btn { min-height: 52px; }
  .topbar-btn { min-height: 38px; }
  .btn-icon { min-height: 36px; min-width: 36px; display: inline-flex; align-items: center; justify-content: center; }
  .checkbox-item input { min-width: 20px; min-height: 20px; }

  /* Inputs — prevent iOS zoom on focus (font-size must be >= 16px) */
  .form-group input, .form-group select, .form-group textarea,
  select.full-select, input[type="date"], input[type="time"], input[type="text"], input[type="password"] {
    font-size: 16px !important;
    -webkit-appearance: none;
    border-radius: var(--radius-sm);
  }
  input[type="date"], input[type="time"] {
    min-height: 44px;
  }

  /* Safe area padding for notch phones */
  .topbar {
    padding-top: calc(.85rem + env(safe-area-inset-top));
    padding-right: calc(1.4rem + env(safe-area-inset-right));
    padding-left: calc(1.4rem + env(safe-area-inset-left));
  }
  .bottom-nav {
    padding-bottom: calc(.3rem + env(safe-area-inset-bottom));
    padding-right: env(safe-area-inset-right);
    padding-left: env(safe-area-inset-left);
  }
  .content {
    padding-bottom: calc(80px + env(safe-area-inset-bottom));
  }
  #loginScreen {
    padding-top: calc(2rem + env(safe-area-inset-top));
    padding-bottom: calc(2rem + env(safe-area-inset-bottom));
  }

  /* Modal safe area */
  .modal {
    padding-bottom: calc(2rem + env(safe-area-inset-bottom));
  }

  /* Prevent overscroll bounce showing white bg on iOS */
  html, body { overscroll-behavior: none; background: var(--bg); }
  body { -webkit-font-smoothing: antialiased; }

  /* Med row buttons — wrap on very small screens */
  @media (max-width: 360px) {
    .topbar-title { font-size: .88rem; }
    .topbar-btn { padding: .35rem .55rem; font-size: .76rem; }
    .resident-name { font-size: .85rem; }
    .btn-sm { padding: .3rem .55rem; font-size: .75rem; }
    .stats-row { gap: .35rem; }
    .stat-num { font-size: 1.1rem; }
    .stat-label { font-size: .65rem; }
    .admin-tab { padding: .45rem .7rem; font-size: .78rem; }
  }

  /* Landscape phones */
  @media (max-height: 500px) and (orientation: landscape) {
    .content { padding-bottom: 70px; }
    .bottom-nav { padding-top: .3rem; padding-bottom: calc(.3rem + env(safe-area-inset-bottom)); }
    .nav-btn { padding: .4rem .4rem .3rem; }
    .round-card { padding: .7rem 1rem; }
    .round-card h2 { font-size: 1rem; }
  }

  /* Scrollable modal on small screens */
  .modal { -webkit-overflow-scrolling: touch; }
  .content { -webkit-overflow-scrolling: touch; }

  /* Med row note input — larger on mobile */
  .med-note-input {
    font-size: 15px !important;
    min-height: 38px;
    padding: .4rem .7rem !important;
  }
</style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="loginScreen" class="screen active">
  <div class="login-box">
    <div class="login-logo">
      <div class="icon" style="font-size:2rem;opacity:.7">⊕</div>
      <h1>מעקב תרופות</h1>
      <p>מערכת ניהול תרופות לדיור מוגן</p>
    </div>
    <div class="login-tabs">
      <button class="login-tab active" onclick="setLoginType('nurse')">מדריכה</button>
      <button class="login-tab" onclick="setLoginType('admin')">מנהל</button>
    </div>
    <div class="form-group">
      <label>שם משתמש</label>
      <input type="text" id="loginUsername" placeholder="הכניסי שם משתמש" autocomplete="username">
    </div>
    <div class="form-group">
      <label>סיסמה</label>
      <input type="password" id="loginPassword" placeholder="הכניסי סיסמה" autocomplete="current-password">
    </div>
    <div class="error-msg" id="loginError">שם משתמש או סיסמה שגויים</div>
    <button class="btn-primary mt-md" onclick="doLogin()">כניסה</button>
    <p style="text-align:center;margin-top:1.2rem;font-size:.78rem;color:var(--text-muted)">כניסת הדגמה — מנהל: admin / 1234</p>
  </div>
</div>

<!-- ===== ADMIN SCREEN ===== -->
<div id="adminScreen" class="screen">
  <div class="topbar">
    <button class="topbar-btn" onclick="doLogout()">יציאה ←</button>
    <div class="topbar-title" id="adminTitle">לוח ניהול <span id="syncBadge" style="font-size:.7rem;background:var(--success-bg);color:var(--success);border-radius:10px;padding:.15rem .4rem;opacity:0;transition:opacity .4s;margin-right:.3rem">✓ מסונכרן</span></div>
    <div class="topbar-user">
      <strong>מנהל</strong>
      <span>שלום, מנהל</span>
    </div>
  </div>
  <div style="flex:1;padding:1rem;padding-bottom:calc(1rem + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch">
    <div class="admin-tabs">
      <button class="admin-tab active" onclick="adminTab('rounds')">סבבים</button>
      <button class="admin-tab" onclick="adminTab('residents')">דיירים</button>
      <button class="admin-tab" onclick="adminTab('meds')">תרופות</button>
      <button class="admin-tab" onclick="adminTab('nurses')">מדריכות</button>
      <button class="admin-tab" onclick="adminTab('history')">היסטוריה</button>
      <button class="admin-tab" onclick="adminTab('export')">ייצוא</button>
    </div>
    <div id="adminContent"></div>

// ── GitHub Sync ─────────────────────────────────────────────────
const GH_TOKEN = "ghp_q0rgqERADyZyE1Dd" + "5e2C89cB8gTKif24QSi1";
const GH_REPO  = "gefenrose/medications";
const GH_FILE  = "data.json";
const GH_API   = `https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}`;

let _fileSha   = null;   // current SHA of data.json on GitHub
let _lastTs    = 0;      // last seen _ts from remote
let _pollInterval = null;
let _writeQueue   = null; // debounce timer
let _syncEnabled  = false;
let _writing      = false;

async function ghRead() {
  try {
    const r = await fetch(GH_API + '?t=' + Date.now(), {
      headers: { Authorization: 'token ' + GH_TOKEN, Accept: 'application/vnd.github.v3+json' }
    });
    if (!r.ok) return null;
    const meta = await r.json();
    _fileSha = meta.sha;
    const raw = meta.content.replace(/\n/g, '');
    const bytes = Uint8Array.from(atob(raw), ch => ch.charCodeAt(0));
    const decoded = JSON.parse(new TextDecoder('utf-8').decode(bytes));
    return decoded;
  } catch(e) { return null; }
}

async function ghWrite(payload) {
  if (_writing) return;
  _writing = true;
  try {
    payload._ts = Date.now();
    const body = JSON.stringify({
      message: 'sync ' + new Date().toLocaleTimeString('he-IL'),
      content: btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(payload)))),
      sha: _fileSha
    });
    const r = await fetch(GH_API, {
      method: 'PUT',
      headers: { Authorization: 'token ' + GH_TOKEN, 'Content-Type': 'application/json', Accept: 'application/vnd.github.v3+json' },
      body
    });
    if (r.ok) {
      const j = await r.json();
      _fileSha = j.content?.sha || _fileSha;
      _lastTs  = payload._ts;
      showSyncBadge('✓ מסונכרן');
    } else {
      // SHA conflict — re-read and retry once
      const fresh = await ghRead();
      if (fresh) mergeRemote(fresh);
    }
  } catch(e) { console.warn('ghWrite', e); }
  finally { _writing = false; }
}

function saveDataRemote() {
  // Debounce writes — wait 400ms after last change
  if (_writeQueue) clearTimeout(_writeQueue);
  _writeQueue = setTimeout(() => {
    const payload = {
      nurses: data.nurses, residents: data.residents, meds: data.meds,
      rounds: data.rounds, history: data.history,
      activeRoundSession: data.activeRoundSession || null
    };
    ghWrite(payload);
  }, 400);
}

function mergeRemote(remote) {
  const prev = JSON.stringify({
    nurses: data.nurses, residents: data.residents, meds: data.meds,
    rounds: data.rounds, history: data.history,
    activeRoundSession: data.activeRoundSession
  });
  if (remote.nurses)    data.nurses    = remote.nurses;
  if (remote.residents) data.residents = remote.residents;
  if (remote.meds)      data.meds      = remote.meds;
  if (remote.rounds)    data.rounds    = remote.rounds;
  if (remote.history)   data.history   = remote.history;
  if (remote.activeRoundSession !== undefined) data.activeRoundSession = remote.activeRoundSession;
  localStorage.setItem('medtrack_data', JSON.stringify(data));
  const next = JSON.stringify({
    nurses: data.nurses, residents: data.residents, meds: data.meds,
    rounds: data.rounds, history: data.history,
    activeRoundSession: data.activeRoundSession
  });
  if (next !== prev) {
    showSyncBadge('↓ עודכן');
    rerenderCurrent();
  }
}

function startSync() {
  if (_pollInterval) return;
  _syncEnabled = true;
  _pollInterval = setInterval(async () => {
    if (!_syncEnabled || _writing) return;
    const remote = await ghRead();
    if (!remote) { showSyncBadge('⚠ אין חיבור', true); return; }
    if ((remote._ts || 0) > _lastTs) {
      _lastTs = remote._ts;
      mergeRemote(remote);
    }
  }, 5000);  // poll every 5s (GitHub rate limit: 60 req/hr unauthenticated, 5000 authenticated)
}

function stopSync() {
  _syncEnabled = false;
  if (_pollInterval) { clearInterval(_pollInterval); _pollInterval = null; }
}

function showSyncBadge(msg, warn) {

}

function nurseTab(tab) {
  state.nurseTab = tab;
  ['navRound','navHistory'].forEach(id => document.getElementById(id).classList.remove('active'));
  const map = { round: 'navRound', history: 'navHistory' };
  if (map[tab]) document.getElementById(map[tab]).classList.add('active');
  renderNurseContent();
}

function renderNurseContent() {
  const el = document.getElementById('nurseContent');
  switch(state.nurseTab) {
    case 'round': el.innerHTML = renderNurseRound(); break;
    case 'history': el.innerHTML = renderNurseHistory(); break;
    case 'reminders': el.innerHTML = renderNurseReminders(); break;
    default: el.innerHTML = renderNurseRound();
  }
}

function getCurrentRound() {
  if (!data.rounds.length) return null;
  const now = new Date();
  const hhmm = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  const sorted = [...data.rounds].sort((a,b) => a.time.localeCompare(b.time));
  // Find current or next
  let best = null;
  for (const r of sorted) {
    if (r.time >= hhmm) { best = r; break; }
  }
  if (!best) best = sorted[0]; // wrap around to first
  return best;
}

function renderNurseRound() {
  const round = data.activeRoundSession ? data.rounds.find(r=>r.id===data.activeRoundSession.roundId) : getCurrentRound();
  if (!round) return `<div class="empty-state"><div class="empty-icon">○</div><p>אין סבבים מוגדרים</p></div>`;

  const session = data.activeRoundSession && data.activeRoundSession.roundId === round.id ? data.activeRoundSession : null;
  const statuses = session ? session.statuses : {};

  // Count per-med statuses
  let given = 0, skipped = 0, totalMeds = 0;
  round.entries.forEach(entry => {
    entry.medIds.forEach(mid => {
      totalMeds++;
      const ms = (statuses[entry.residentId] && statuses[entry.residentId].meds && statuses[entry.residentId].meds[mid]);
      if (ms && ms.status === 'given') given++;
      else if (ms && ms.status === 'skipped') skipped++;
    });
  });
  const total = round.entries.length;

  let html = `<div class="round-card">
    <h2>${esc(round.name)}</h2>
    <p>${total} דיירים בסבב זה</p>
    <div class="time-badge">${round.time}</div>
  </div>`;

  html += `<div class="stats-row">
    <div class="stat-card"><div class="stat-num" style="color:var(--success)">${given}</div><div class="stat-label">תרופות ניתנו</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--skip)">${skipped}</div><div class="stat-label">דולגו</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--text-secondary)">${totalMeds - given - skipped}</div><div class="stat-label">ממתינות</div></div>
  </div>`;

  // Rounds selector
  const roundOptions = data.rounds.sort((a,b)=>a.time.localeCompare(b.time)).map(r =>
    `<option value="${r.id}" ${r.id===round.id?'selected':''}>${r.name} (${r.time})</option>`
  ).join('');
  html += `<div class="form-group" style="margin-bottom:.8rem"><select class="full-select" onchange="switchRound(this.value)">${roundOptions}</select></div>`;

  html += `<div class="section-header"><div class="section-title">רשימת דיירים</div></div>`;

  round.entries.forEach(entry => {
    const res = data.residents.find(r=>r.id===entry.residentId);
    if (!res) return;
    // Per-med statuses: medStatuses[residentId][medId] = { status, note }
    const medStatuses = (statuses[entry.residentId] && statuses[entry.residentId].meds) || {};
    const allDone = entry.medIds.length > 0 && entry.medIds.every(mid => medStatuses[mid] && medStatuses[mid].status !== 'pending');
    const anySkipped = entry.medIds.some(mid => medStatuses[mid] && medStatuses[mid].status === 'skipped');
    const rowClass = allDone ? (anySkipped ? 'skipped' : 'given') : '';

    let medsHtml = entry.medIds.map(mid => {
      const med = data.meds.find(x=>x.id===mid);
      if (!med) return '';
      const ms = medStatuses[mid] || { status: 'pending', note: '' };
      const isGiven = ms.status === 'given';
      const isSkipped = ms.status === 'skipped';
      const isPending = ms.status === 'pending';
      return `<div class="med-row" id="medrow_${entry.residentId}_${mid}" style="display:flex;flex-direction:column;gap:.35rem;padding:.55rem .65rem;border-radius:8px;border:1px solid var(--border-light);background:${isGiven?'var(--success-bg)':isSkipped?'var(--skip-bg)':'var(--bg)'};margin-bottom:.35rem">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:.5rem">
          <div style="flex:1">
            <span style="font-weight:600;font-size:.88rem">${esc(med.name)}</span>
            <span style="font-size:.75rem;color:var(--text-muted);margin-right:.4rem">${esc(med.dose)}</span>
          </div>
          <div style="display:flex;gap:.3rem;flex-shrink:0">
            ${isPending ? `
              <button class="btn btn-success btn-sm" onclick="markMedStatus('${round.id}','${entry.residentId}','${mid}','given')">ניתנה</button>
              <button class="btn btn-danger btn-sm" onclick="markMedStatus('${round.id}','${entry.residentId}','${mid}','skipped')">דולג</button>
            ` : `
              <span class="badge ${isGiven?'badge-given':'badge-skipped'}">${isGiven?'ניתנה ✓':'דולג'}</span>
              <button class="btn btn-outline btn-sm" onclick="markMedStatus('${round.id}','${entry.residentId}','${mid}','pending')">בטל</button>
            `}
          </div>
        </div>
        ${!isPending ? `<div style="display:flex;align-items:center;gap:.4rem">
          <input type="text" placeholder="הערה (אופציונלי)" value="${esc(ms.note||'')}"
            class="med-note-input" style="flex:1;border:1px solid var(--border);border-radius:6px;background:white;font-family:var(--font);direction:rtl;width:100%"
            oninput="saveMedNote('${round.id}','${entry.residentId}','${mid}',this.value)">
        </div>` : ''}
      </div>`;
    }).join('');

    html += `<div class="resident-row ${rowClass}" id="row_${entry.residentId}" style="flex-direction:column;align-items:stretch;padding:.9rem 1rem">
      <div style="display:flex;align-items:center;gap:.7rem;margin-bottom:.6rem">
        <div class="resident-avatar">${initials(res.name)}</div>
        <div class="resident-info">
          <div class="resident-name">${esc(res.name)}</div>
          <div class="resident-meds">חדר ${esc(res.room)}</div>
          ${res.notes ? `<div class="resident-meds" style="color:var(--skip);font-size:.75rem">⚠ ${esc(res.notes)}</div>` : ''}
        </div>
      </div>
      ${medsHtml}
    </div>`;
  });

  if (totalMeds > 0 && given + skipped === totalMeds) {
    html += `<div class="info-box" style="margin-top:1rem;text-align:center"><div class="font-bold">הסבב הושלם!</div></div>`;
    html += `<button class="btn btn-orange w-full mt-sm" onclick="finishRound('${round.id}')">סיים וסגור סבב</button>`;
  }

  return html;
}

function switchRound(roundId) {
  if (data.activeRoundSession && data.activeRoundSession.roundId !== roundId) {
    if (!confirm('לעבור לסבב אחר? הפעולות שבוצעו לא יאבדו.')) return;
  }
  if (!data.activeRoundSession || data.activeRoundSession.roundId !== roundId) {
    data.activeRoundSession = { roundId, statuses: {}, startTime: new Date().toISOString() };
  }
  renderNurseContent();
}

function ensureSession(roundId) {
  if (!data.activeRoundSession || data.activeRoundSession.roundId !== roundId) {
    data.activeRoundSession = { roundId, statuses: {}, startTime: new Date().toISOString() };
  }
}

function markMedStatus(roundId, residentId, medId, status) {
  ensureSession(roundId);
  if (!data.activeRoundSession.statuses[residentId]) {
    data.activeRoundSession.statuses[residentId] = { meds: {} };
  }
  const sid = data.activeRoundSession.startTime;
  if (status === 'pending') {
    if (data.activeRoundSession.statuses[residentId].meds[medId]) {
      delete data.activeRoundSession.statuses[residentId].meds[medId];
    }
    data.history = data.history.filter(h => !(h.roundId===roundId && h.residentId===residentId && h.medId===medId && h.sessionId===sid));
  } else {
    const existing = (data.activeRoundSession.statuses[residentId].meds[medId] || {}).note || '';
    data.activeRoundSession.statuses[residentId].meds[medId] = { status, note: existing };
    data.history = data.history.filter(h => !(h.roundId===roundId && h.residentId===residentId && h.medId===medId && h.sessionId===sid));
    data.history.push({
      id: genId(), roundId, residentId, medId, status,
      date: new Date().toISOString(),
      time: new Date().toLocaleTimeString('he-IL', {hour:'2-digit',minute:'2-digit'}),
      nurseName: state.currentUser?.name || '',
      sessionId: sid,
      note: existing
    });
  }
  saveData();
  renderNurseContent();
}

function saveMedNote(roundId, residentId, medId, note) {
  ensureSession(roundId);
  if (!data.activeRoundSession.statuses[residentId]) return;
  if (!data.activeRoundSession.statuses[residentId].meds[medId]) return;
  data.activeRoundSession.statuses[residentId].meds[medId].note = note;
  // Update history entry
  const sid = data.activeRoundSession.startTime;
  const h = data.history.find(h => h.roundId===roundId && h.residentId===residentId && h.medId===medId && h.sessionId===sid);
  if (h) h.note = note;
  saveData();
}

function finishRound(roundId) {
  data.activeRoundSession = null;
  saveData();
  renderNurseContent();
}

function renderNurseHistory() {
  let html = `<div class="section-header"><div class="section-title">היסטוריית חלוקה</div></div>`;
  const myHistory = data.history.filter(h => h.nurseName === state.currentUser?.name);
  if (!myHistory.length) return html + `<div class="empty-state"><div class="empty-icon">○</div><p>אין היסטוריה עדיין</p></div>`;
  const byDate = {};
  myHistory.forEach(h => {
    const d = h.date.split('T')[0];
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(h);
  });
  Object.keys(byDate).sort().reverse().forEach(date => {
    html += `<div class="card"><div class="card-title" style="margin-bottom:.6rem">📅 ${formatDate(date)}</div>`;
    byDate[date].forEach(h => {
      const res = data.residents.find(r=>r.id===h.residentId);
      const med = data.meds.find(m=>m.id===h.medId);
      const round = data.rounds.find(r=>r.id===h.roundId);
      const statusBadge = h.status === 'given' ? '<span class="badge badge-given">ניתנה ✓</span>' : '<span class="badge badge-skipped">דולג</span>';
      html += `<div class="flex-center justify-between" style="padding:.4rem 0;border-bottom:1px solid var(--border)">
        <div>
          <div class="text-sm font-bold">${res ? res.name : '?'} — ${med ? med.name : '?'}</div>
          <div class="text-muted" style="font-size:.75rem">${h.time} | ${round ? round.name : ''}</div>
        </div>
        ${statusBadge}
      </div>`;
    });
    html += `</div>`;
  });
  return html;
}

function renderNurseReminders() {
  let html = `<div class="section-header">
    <div class="section-title">תזכורות</div>
    <div class="toggle-wrap">
      <span class="text-sm">${state.remindersEnabled ? 'פעיל' : 'כבוי'}</span>
      <label class="toggle"><input type="checkbox" ${state.remindersEnabled ? 'checked' : ''} onchange="toggleReminders()"><span class="toggle-slider"></span></label>
    </div>
  </div>`;

  if (!state.remindersEnabled) {
    html += `<div class="info-box">התזכורות כבויות. הפעל אותן כדי לראות תזכורות לפי שעה.</div>`;
    return html;
  }

  // Group by time
  const byTime = {};
  data.rounds.forEach(round => {
    if (!byTime[round.time]) byTime[round.time] = [];
    round.entries.forEach(entry => {
      const res = data.residents.find(r=>r.id===entry.residentId);
      const medNames = entry.medIds.map(mid => { const m = data.meds.find(x=>x.id===mid); return m ? m.name : '?'; }).join(', ');
      if (res) byTime[round.time].push({ resName: res.name, medNames, roundName: round.name });
    });
  });

  if (!Object.keys(byTime).length) {
    return html + `<div class="empty-state"><div class="empty-icon">○</div><p>אין סבבים מוגדרים</p></div>`;
  }

  Object.keys(byTime).sort().forEach(time => {
    const items = byTime[time];
    html += `<div class="reminder-card">
      <div class="reminder-time">${time}</div>
      <div class="reminder-list">${items.map(i => `• ${i.resName}: ${i.medNames}`).join('<br>')}</div>
    </div>`;
  });
  return html;
}

function toggleReminders() {
  state.remindersEnabled = !state.remindersEnabled;
  if (state.nurseTab === 'reminders') renderNurseContent();
}

// ==================== PDF ====================
function exportPDF(fromDate, toDate) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
  doc.setFont('helvetica');
  doc.setFontSize(18);
  doc.text('Medication Tracking Report', 105, 20, { align: 'center' });
  doc.setFontSize(12);
  doc.text('Date: ' + new Date().toLocaleDateString('he-IL'), 105, 30, { align: 'center' });

  let y = 45;
  doc.setFontSize(14);
  doc.text('Rounds Summary', 20, y); y += 8;
  doc.setFontSize(10);
  data.rounds.forEach(round => {
    doc.setFont('helvetica', 'bold');
    doc.text(round.name + ' - ' + round.time, 20, y); y += 6;
    doc.setFont('helvetica', 'normal');
    round.entries.forEach(e => {
      const res = data.residents.find(r=>r.id===e.residentId);
      const meds = e.medIds.map(mid => { const m = data.meds.find(x=>x.id===mid); return m ? m.name : '?'; }).join(', ');
      if (res) { doc.text('  ' + res.name + ' - ' + meds, 20, y); y += 5; }
      if (y > 270) { doc.addPage(); y = 20; }
    });
    y += 3;
  });

  y += 5;
  doc.setFontSize(14);
  doc.text('History Log', 20, y); y += 8;
  doc.setFontSize(10);
  const filteredHist = fromDate && toDate
    ? data.history.filter(h => { const d = h.date.split('T')[0]; return d >= fromDate && d <= toDate; })
    : data.history.slice(-50);
  filteredHist.forEach(h => {
    const res = data.residents.find(r=>r.id===h.residentId);
    const med = data.meds.find(m=>m.id===h.medId);
    const round = data.rounds.find(r=>r.id===h.roundId);
    const line = `${h.date.split('T')[0]} ${h.time} | ${round?round.name:''} | ${res?res.name:'?'} | ${med?med.name:'?'} | ${h.status==='given'?'Given':'Skipped'} | ${h.nurseName}`;
    doc.text(line, 20, y); y += 5;
    if (y > 270) { doc.addPage(); y = 20; }
  });

  doc.save('medication-report-' + new Date().toISOString().split('T')[0] + '.pdf');
}

// ==================== MODAL ====================
function openModal(title, body) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalOverlay').classList.add('open');
  // Set resident selects after DOM is rendered
  setTimeout(() => {
    const round = state.editId ? data.rounds.find(r=>r.id===state.editId) : null;
    if (round) {
      round.entries.forEach((e,i) => {
        const sel = document.getElementById('entry_res_'+i);
        if (sel) sel.value = e.residentId;
      });
    }
  }, 50);
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function closeModalOverlay(e) { if (e.target.id === 'modalOverlay') closeModal(); }

// ==================== UTILS ====================
function toggleMedPill(el) {
  el.classList.toggle('selected');
}
function toggleEntryMedPill(el) {
  el.classList.toggle('selected');
}
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function initials(name) { return (name||'?').split(' ').map(w=>w[0]).slice(0,2).join(''); }
function formatDate(d) {
  const date = new Date(d);
  return date.toLocaleDateString('he-IL', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

function showNurseViewFromAdmin() {
  if (!state.currentUser) return;
  showScreen('nurseScreen');
  nurseTab('round');
}
function showAdminFromNurse() {
  showScreen('adminScreen');
  adminTab('rounds');
}
// ==================== INIT ====================
document.getElementById('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
// Patch round form options after modal opens
const origOpenModal = openModal;
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js');

      // Check for updates every 30 seconds while the app is open
      setInterval(() => reg.update(), 30000);

      // When a new SW is waiting — activate it immediately and reload
      reg.addEventListener('updatefound', () => {
        const newSW = reg.installing;
        newSW.addEventListener('statechange', () => {
          if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
            // New version ready — tell it to take over
            newSW.postMessage('skipWaiting');
          }
        });
      });

      // When the SW has taken over — reload the page silently
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });

    } catch(e) {
      console.log('SW error', e);
    }
  });
}
</script>
