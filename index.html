<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="תרופות">
<meta name="theme-color" content="#006C70">
<title>מעקב תרופות – דיור מוגן</title>
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- v19 -->
<link rel="manifest" href="./manifest.json">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap');
  :root {
    /* Primary — muted teal/sage, not screaming blue */
    --primary:       #4B86A8;
    --primary-dark:  #2F617C;
    --primary-light: #EAF4FA;
    --primary-mid:   #9FC7DD;

    /* Surfaces — Material You tonal */
    --bg:            #F4F6F4;
    --bg2:           #E8EDE8;
    --card:          #FFFFFF;
    --surface1:      #F0F4F2;
    --surface2:      #E4EDE9;

    /* Semantic */
    --success:       #3A7D5C;
    --success-bg:    #EBF5EE;
    --skip:          #B3261E;
    --skip-bg:       #F9EAEA;

    /* Neutral */
    --border:        #CAD0CC;
    --border-light:  #E4EAE6;
    --text:          #191C1B;
    --text-secondary:#404944;
    --text-muted:    #6F7975;

    /* Elevation */
    --shadow:    0 1px 2px rgba(0,0,0,0.06), 0 1px 6px rgba(0,0,0,0.04);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.08), 0 4px 20px rgba(0,0,0,0.05);

    --radius:    16px;
    --radius-sm: 12px;
    --font: -apple-system, 'Heebo', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); direction: rtl; min-height: 100vh; font-size: 15px; }

  .screen { display: none; height: 100vh; height: 100dvh; max-height: 100dvh; flex-direction: column; overflow: hidden; }
  .screen.active { display: flex; }

  /* LOGIN */
  #loginScreen { background: var(--bg); align-items: center; justify-content: center; padding: 2rem; }
  .login-box { background: var(--card); border-radius: 24px; padding: 2.5rem 2rem; width: 100%; max-width: 380px; border: none; box-shadow: var(--shadow-md); }
  .login-logo { text-align: center; margin-bottom: 2rem; }
  .login-logo .icon { font-size: 2.5rem; }
  .login-logo h1 { font-size: 1.5rem; font-weight: 700; color: var(--text); margin-top: .6rem; letter-spacing: -.03em; }
  .login-logo p { color: var(--text-secondary); font-size: 0.88rem; margin-top: .3rem; }
  .login-tabs { display: flex; gap: 6px; margin-bottom: 1.5rem; background: var(--bg); border-radius: 10px; padding: 4px; }
  .login-tab { flex: 1; padding: .55rem; border: none; background: transparent; border-radius: 8px; cursor: pointer; font-size: .9rem; font-family: var(--font); color: var(--text-secondary); transition: all .2s; font-weight: 500; }
  .login-tab.active { background: var(--primary); color: white; font-weight: 600; border-radius: 8px; }
  .form-group { margin-bottom: 1.1rem; }
  .form-group label { display: block; font-size: .82rem; font-weight: 600; margin-bottom: .4rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .03em; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: .7rem 1rem; border: none; border-radius: var(--radius-sm); font-size: .95rem; font-family: var(--font); color: var(--text); background: var(--bg); direction: rtl; transition: border-color .2s, background .2s; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary-mid); background: white; }
  .btn-primary { width: 100%; padding: .85rem; background: var(--primary); color: white; border: none; border-radius: var(--radius); font-size: 1rem; font-weight: 600; cursor: pointer; font-family: var(--font); transition: all .15s; letter-spacing: .005em; }
  .btn-primary:hover { background: var(--primary-dark); }
  .error-msg { color: var(--skip); font-size: .83rem; margin-top: .5rem; display: none; }

  /* TOPBAR */
  .topbar { background: rgba(244,246,244,0.92); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: .5px solid var(--border-light); padding: .85rem 1.4rem; display: flex; align-items: center; justify-content: space-between; gap: .5rem; position: sticky; top: 0; z-index: 100; }
  .topbar-title { font-size: 1rem; font-weight: 600; flex: 1; text-align: center; color: var(--text); letter-spacing: -.01em; }
  .topbar-user { text-align: left; line-height: 1.3; }
  .topbar-user strong { font-size: .95rem; color: var(--text); display: block; }
  .topbar-user span { font-size: .78rem; color: var(--text-secondary); }
  .topbar-btn { background: transparent; border: none; color: var(--text-secondary); border-radius: var(--radius-sm); padding: .4rem .75rem; cursor: pointer; font-size: .82rem; font-family: var(--font); display: flex; align-items: center; gap: .3rem; transition: all .2s; white-space: nowrap; font-weight: 500; }
  .topbar-btn:hover { border-color: var(--primary-mid); color: var(--primary); }
  .topbar-btn.accent { background: var(--primary); border-color: var(--primary); color: white; font-weight: 600; border-radius: 8px; }
  .topbar-btn.accent:hover { background: var(--primary-dark); }
  .topbar-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--primary-light); border: 2px solid var(--primary-mid); display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 700; color: var(--primary); flex-shrink: 0; cursor: default; }

  /* BOTTOM NAV */
  .bottom-nav { position: sticky; top: 0; width: 100%; background: rgba(244,246,244,0.96); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: .5px solid var(--border-light); border-top: none; display: flex; z-index: 99; padding-bottom: 0; flex-shrink: 0; }
  .nav-btn { flex: 1; padding: .65rem .4rem .45rem; border: none; background: transparent; cursor: pointer; font-family: var(--font); font-size: .68rem; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 2px; transition: color .2s; font-weight: 500; }
  .nav-btn .nav-icon { font-size: 1.2rem; }
  .nav-btn.active { color: var(--primary); font-weight: 600; border-bottom: 2px solid var(--primary); }

  .content { flex: 1; padding: 1.2rem; padding-bottom: 1.2rem; overflow-y: auto; max-width: 700px; margin: 0 auto; width: 100%; min-height: 0; }
  .content-wide { flex: 1; padding: 1.2rem; padding-bottom: 30px; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* CARDS */
  .card { background: var(--card); border-radius: var(--radius); border: none; padding: 1.2rem; margin-bottom: .8rem; box-shadow: var(--shadow); }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: .8rem; }
  .card-title { font-size: .95rem; font-weight: 700; color: var(--text); }
  .card-subtitle { font-size: .78rem; color: var(--text-secondary); margin-top: .2rem; }

  /* BUTTONS */
  .btn { padding: .5rem 1rem; border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: .88rem; font-weight: 600; font-family: var(--font); transition: all .15s; }
  .btn-sm { padding: .3rem .7rem; font-size: .78rem; border-radius: 6px; }
  .btn-success { background: var(--success-bg); color: var(--success); border: none; font-weight: 600; }
  .btn-success:hover { background: #D4EDDF; }
  .btn-danger { background: var(--skip-bg); color: var(--skip); border: none; font-weight: 600; }
  .btn-danger:hover { background: #F9DEDC; }
  .btn-outline { background: transparent; border: none; color: var(--text-secondary); }
  .btn-outline:hover { border-color: var(--primary-mid); color: var(--primary); }
  .btn-orange { background: var(--primary); color: white; border: none; font-weight: 600; }
  .btn-orange:hover { background: var(--primary-dark); }
  .btn-icon { background: transparent; border: 1px solid var(--border-light); border-radius: 6px; padding: .28rem .48rem; cursor: pointer; font-size: .82rem; color: var(--text-muted); transition: all .15s; }
  .btn-icon:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary-mid); }

  /* BADGE */
  .badge { display: inline-flex; align-items: center; gap: .25rem; padding: .25rem .6rem; border-radius: 20px; font-size: .75rem; font-weight: 600; }
  .badge-given { background: var(--success-bg); color: var(--success); border: none; }
  .badge-skipped { background: var(--skip-bg); color: var(--skip); border: none; }
  .badge-pending { background: var(--pending-bg); color: var(--text-secondary); border: none; }

  /* ADMIN TABS */
  .admin-tabs { display: flex; gap: .45rem; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: .25rem; margin-bottom: 1.2rem; }
  .admin-tabs::-webkit-scrollbar { display: none; }
  .admin-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .28rem; padding: .7rem .9rem; min-height: 66px; min-width: 66px; border: 1.5px solid var(--border-light); border-radius: 14px; background: white; color: var(--text-secondary); cursor: pointer; font-size: .73rem; font-weight: 600; font-family: var(--font); white-space: nowrap; flex-shrink: 0; box-shadow: var(--shadow); transition: all .18s; }
  .admin-tab.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 3px 12px rgba(61,107,94,.28); }
  .admin-tab .tab-icon { display: flex; align-items: center; }
  .admin-tab.active .tab-icon { opacity: 1; }

  /* ADMIN ACTION BUTTONS */
  .admin-add-btn { width: 100%; padding: .85rem 1rem; border-radius: 13px; border: 2px dashed var(--primary-mid); background: var(--primary-light); color: var(--primary); font-size: .95rem; font-weight: 700; cursor: pointer; font-family: var(--font); margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; gap: .45rem; transition: all .15s; }
  .admin-add-btn:active { background: var(--primary); color: white; border-style: solid; }
  .admin-edit-btn { padding: .42rem .8rem; border-radius: 9px; border: 1.5px solid var(--primary-mid); background: var(--primary-light); color: var(--primary); font-size: .82rem; font-weight: 700; cursor: pointer; font-family: var(--font); min-height: 38px; transition: all .12s; }
  .admin-delete-btn { padding: .42rem .8rem; border-radius: 9px; border: 1.5px solid #e5a0a0; background: #fff4f4; color: var(--skip); font-size: .82rem; font-weight: 700; cursor: pointer; font-family: var(--font); min-height: 38px; transition: all .12s; }
  .section-desc { font-size: .76rem; color: var(--text-muted); margin-top: .12rem; font-weight: 400; }

  /* SECTION */
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: .9rem; }
  .section-title { font-size: .78rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; }

  /* RESIDENT ROW */
  .resident-row { display: flex; align-items: center; gap: .8rem; padding: .9rem 1rem; border-radius: var(--radius); border: none; margin-bottom: .5rem; background: white; transition: all .2s; box-shadow: var(--shadow); }
  .resident-row.given { background: var(--success-bg); border: none; }
  .resident-row.skipped { background: var(--skip-bg); border: none; }
  .resident-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: .9rem; font-weight: 700; color: var(--primary); flex-shrink: 0; border: none; }
  .resident-avatar.photo { background-size: cover; background-position: center; color: transparent; overflow: hidden; }
  .resident-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .resident-info { flex: 1; }
  .resident-name { font-weight: 700; font-size: .92rem; color: var(--text); }
  .resident-meds { font-size: .75rem; color: var(--text-secondary); margin-top: .18rem; }
  .resident-actions { display: flex; gap: .35rem; flex-shrink: 0; align-items: center; }

  /* TOGGLE */
  .toggle-wrap { display: flex; align-items: center; gap: .5rem; }
  .toggle { position: relative; display: inline-block; width: 44px; height: 24px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: var(--border); border-radius: 24px; transition: .3s; }
  .toggle-slider:before { position: absolute; content: ""; height: 18px; width: 18px; right: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .3s; }
  input:checked + .toggle-slider { background: var(--success); }
  input:checked + .toggle-slider:before { transform: translateX(-20px); }

  /* LIST ITEMS */
  .list-item { display: flex; align-items: center; gap: .8rem; padding: .85rem 1rem; background: white; border: none; border-radius: var(--radius); margin-bottom: .45rem; box-shadow: var(--shadow); }
  .list-item-content { flex: 1; }
  .list-item-title { font-weight: 600; font-size: .9rem; color: var(--text); }
  .list-item-sub { font-size: .75rem; color: var(--text-secondary); margin-top: .15rem; }
  .list-item-actions { display: flex; gap: .3rem; }

  /* ROUND HEADER CARD */
  .round-card { background: linear-gradient(160deg, #3F789A 0%, #6EA6C3 100%); border: none; border-radius: var(--radius); padding: 1.1rem 1.3rem; margin-bottom: 1rem; }
  .round-card h2 { font-size: 1.2rem; font-weight: 700; color: white; }
  .round-card p { font-size: .82rem; color: rgba(255,255,255,.75); margin-top: .2rem; }
  .round-card .time-badge { background: rgba(255,255,255,.25); color: white; border-radius: 6px; padding: .25rem .65rem; font-size: .82rem; font-weight: 700; display: inline-block; margin-top: .5rem; }

  /* STATS */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin-bottom: 1rem; }
  .stat-card { background: white; border: none; border-radius: 12px; padding: .65rem; text-align: center; box-shadow: var(--shadow); }
  .stat-num { font-size: 1.35rem; font-weight: 700; }
  .stat-label { font-size: .7rem; color: var(--text-muted); margin-top: .15rem; font-weight: 500; }

  /* HISTORY */
  .history-entry { border-right: 3px solid var(--primary); padding-right: .8rem; margin-bottom: .7rem; }
  .history-date { font-size: .75rem; color: var(--text-muted); font-weight: 600; }
  .history-detail { font-size: .85rem; color: var(--text); margin-top: .15rem; }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(42,36,32,0.45); z-index: 200; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--card); border-radius: 24px 24px 0 0; padding: 1.4rem 1.4rem 2rem; width: 100%; max-width: 500px; max-height: 88vh; overflow-y: auto; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; padding-bottom: .8rem; border-bottom: 1px solid var(--border-light); }
  .modal-title { font-size: 1rem; font-weight: 700; color: var(--text); }
  .modal-close { background: var(--bg); border: none; border-radius: 7px; padding: .35rem .55rem; cursor: pointer; font-size: .9rem; color: var(--text-secondary); line-height: 1; }

  /* EMPTY */
  .empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--text-muted); background: white; border-radius: var(--radius); border: none; box-shadow: var(--shadow); }
  .empty-state .empty-icon { font-size: 2rem; margin-bottom: .6rem; opacity: .5; }
  .empty-state p { font-size: .88rem; }

  /* REMINDER */
  .reminder-card { background: white; border: none; border-radius: var(--radius); padding: .9rem 1rem; margin-bottom: .5rem; box-shadow: var(--shadow); }
  .reminder-time { font-size: 1rem; font-weight: 700; color: var(--primary); }
  .reminder-list { font-size: .82rem; color: var(--text-secondary); margin-top: .35rem; line-height: 1.7; }

  /* MISC */
  .checkbox-group { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem; }
  .checkbox-item { display: none; }
  .med-pill { display: inline-flex; align-items: center; gap: .35rem; padding: .45rem .85rem; border-radius: 20px; border: 1.5px solid var(--border-light); background: white; cursor: pointer; font-size: .85rem; font-weight: 500; color: var(--text-secondary); transition: all .18s; user-select: none; -webkit-tap-highlight-color: transparent; min-height: 38px; }
  .med-pill.selected { background: var(--surface2); border-color: var(--primary-mid); color: var(--primary); font-weight: 700; }
  .med-pill.selected::before { content: "✓ "; font-size: .8rem; }
  .photo-picker { display: flex; align-items: center; gap: .75rem; padding: .75rem; border: 1px solid var(--border-light); border-radius: var(--radius-sm); background: var(--surface1); }
  .photo-picker .resident-avatar { width: 58px; height: 58px; font-size: 1rem; }
  .photo-picker-actions { display: flex; flex-wrap: wrap; gap: .45rem; }
  .photo-file { position: absolute; inline-size: 1px; block-size: 1px; opacity: 0; pointer-events: none; }
  .divider { height: 1px; background: var(--border-light); margin: .8rem 0; }
  .text-muted { color: var(--text-secondary); font-size: .83rem; }
  .mt-sm { margin-top: .5rem; }
  .mt-md { margin-top: 1rem; }
  .flex { display: flex; }
  .flex-center { display: flex; align-items: center; }
  .gap-sm { gap: .45rem; }
  .gap-md { gap: .8rem; }
  .justify-between { justify-content: space-between; }
  .w-full { width: 100%; }
  .font-bold { font-weight: 700; }
  .text-sm { font-size: .83rem; }
  select.full-select { width: 100%; padding: .6rem 1rem; border: none; border-radius: var(--radius-sm); font-size: .92rem; font-family: var(--font); direction: rtl; background: var(--bg); color: var(--text); }
  .info-box { background: var(--primary-light); border-radius: 12px; padding: .75rem 1rem; border-right: 3px solid var(--primary); margin-bottom: .8rem; font-size: .85rem; color: var(--primary-dark); }
  .tag { display: inline-block; background: var(--primary-light); color: var(--primary-dark); padding: .18rem .55rem; border-radius: 20px; font-size: .75rem; font-weight: 600; margin: 2px; }
  .page-hint { text-align: center; padding: .8rem; font-size: .8rem; color: var(--text-muted); }
  .pill-tabs { display: flex; gap: 6px; margin-bottom: 1rem; }
  .pill-tab { padding: .45rem 1.1rem; border: 1.5px solid var(--border-light); border-radius: 20px; cursor: pointer; font-size: .85rem; font-weight: 600; background: white; color: var(--text-secondary); transition: all .2s; font-family: var(--font); }
  .pill-tab.active { background: var(--primary); color: white; border-color: var(--primary); }

  /* ===== MOBILE FIXES ===== */
  /* Touch targets — min 44px */
  .btn, .btn-sm, .nav-btn, .topbar-btn, .admin-tab, .login-tab, .pill-tab {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .btn { min-height: 44px; }
  .btn-sm { min-height: 38px; }
  .nav-btn { min-height: 52px; }
  .topbar-btn { min-height: 38px; }
  .btn-icon { min-height: 36px; min-width: 36px; display: inline-flex; align-items: center; justify-content: center; }
  .checkbox-item input { min-width: 20px; min-height: 20px; }

  /* Inputs — prevent iOS zoom on focus (font-size must be >= 16px) */
  .form-group input, .form-group select, .form-group textarea,
  select.full-select, input[type="date"], input[type="time"], input[type="text"], input[type="password"] {
    font-size: 16px !important;
    -webkit-appearance: none;
    border-radius: var(--radius-sm);
  }
  input[type="date"], input[type="time"] {
    min-height: 44px;
  }

  /* Safe area padding for notch phones */
  .topbar {
    padding-top: calc(.85rem + env(safe-area-inset-top));
    padding-right: calc(1.4rem + env(safe-area-inset-right));
    padding-left: calc(1.4rem + env(safe-area-inset-left));
  }
  .bottom-nav { padding: .3rem 0; }
  .content {
    padding-bottom: 0;
  }
  #loginScreen {
    padding-top: calc(2rem + env(safe-area-inset-top));
    padding-bottom: calc(2rem + env(safe-area-inset-bottom));
  }

  /* Modal safe area */
  .modal {
    padding-bottom: calc(2rem + env(safe-area-inset-bottom));
  }

  /* Prevent overscroll bounce showing white bg on iOS */
  html, body { overscroll-behavior: none; background: var(--bg); height: 100%; }
  body { -webkit-font-smoothing: antialiased; }

  /* Med row buttons — wrap on very small screens */
  @media (max-width: 360px) {
    .topbar-title { font-size: .88rem; }
    .topbar-btn { padding: .35rem .55rem; font-size: .76rem; }
    .resident-name { font-size: .85rem; }
    .btn-sm { padding: .3rem .55rem; font-size: .75rem; }
    .stats-row { gap: .35rem; }
    .stat-num { font-size: 1.1rem; }
    .stat-label { font-size: .65rem; }
    .admin-tab { padding: .55rem .7rem; min-height: 58px; min-width: 58px; font-size: .7rem; }
  }

  /* Landscape phones */
  @media (max-height: 500px) and (orientation: landscape) {
    .content { padding-bottom: 70px; }
    .bottom-nav { padding: .3rem 0; }
    .nav-btn { padding: .4rem .4rem .3rem; }
    .round-card { padding: .7rem 1rem; }
    .round-card h2 { font-size: 1rem; }
  }

  /* Scrollable modal on small screens */
  .modal { -webkit-overflow-scrolling: touch; }
  .content { -webkit-overflow-scrolling: touch; }

  /* Med row note input — larger on mobile */
  .med-note-input {
    font-size: 15px !important;
    min-height: 38px;
    padding: .4rem .7rem !important;
  }

  /* ===== ANIMATIONS ===== */
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(.94); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes popIn {
    0%   { opacity: 0; transform: scale(.88); }
    70%  { transform: scale(1.03); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(22px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: .55; }
  }

  /* Screen transitions */
  .screen.active  { animation: fadeIn .22s ease; }
  .content        { animation: fadeSlideUp .28s ease; }

  /* Cards animate in staggered */
  .card           { animation: scaleIn .24s ease both; }
  .list-item      { animation: fadeSlideUp .2s ease both; }
  .resident-row   { animation: fadeSlideUp .2s ease both; }
  .stat-card      { animation: popIn .3s ease both; }
  .reminder-card  { animation: fadeSlideUp .2s ease both; }

  /* Button press feedback */
  .btn, .btn-icon, .topbar-btn, .nav-btn, .admin-tab, .login-tab, .med-pill {
    transition: transform .1s ease, opacity .1s ease, background .18s ease, color .18s ease, border-color .18s ease;
  }
  .btn:active, .btn-icon:active, .topbar-btn:active { transform: scale(.94); }
  .nav-btn:active  { transform: scale(.88); }
  .med-pill:active { transform: scale(.93); }

  /* Toggle animation */
  .toggle-slider:before { transition: transform .25s cubic-bezier(.4,0,.2,1), background .2s; }

  /* Med row status change */
  .med-row { transition: background .3s ease, border-color .3s ease; }

  /* Sync badge pulse */
  #syncBadge { transition: opacity .4s ease; }

  /* Round card gradient shimmer on load */
  .round-card { animation: fadeSlideDown .3s ease; }

  /* Modal slide up */
  .modal-overlay.open .modal { animation: fadeSlideUp .3s cubic-bezier(.32,0,.67,0); }
  .modal-overlay             { animation: fadeIn .2s ease; }

  /* ===== APPLE HEALTH VISUAL UPGRADES ===== */

  /* Login: gradient background like Health summary */
  #loginScreen {
    background: linear-gradient(160deg, #e8f5f0 0%, #f4f6f4 40%, #f0ece8 100%);
  }
  .login-box {
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 28px;
    box-shadow: 0 8px 40px rgba(74,124,111,.12), 0 2px 8px rgba(0,0,0,.06);
  }

  /* Nurse round-card: richer gradient */
  .round-card {
    background: linear-gradient(145deg, #3F789A 0%, #4B86A8 50%, #78AEC8 100%);
    box-shadow: 0 4px 20px rgba(61,107,94,.3);
  }

  /* Content area: subtle gradient bg */
  #nurseScreen .content,
  #adminScreen > div {
    background: linear-gradient(180deg, var(--bg) 0%, #f0f4f1 100%);
    min-height: 100%;
  }

  /* Cards: lifted, Health-style */
  .card {
    box-shadow: 0 1px 3px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
    border-radius: 18px;
  }
  .list-item, .resident-row, .reminder-card {
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    border-radius: 16px;
  }

  /* Resident avatar: gradient fill */
  .resident-avatar {
    background: linear-gradient(135deg, var(--surface2) 0%, #d0e8e2 100%);
  }

  /* Stat cards: tonal with gradient */
  .stat-card {
    background: linear-gradient(145deg, #fff 0%, var(--surface1) 100%);
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }

  /* Section titles: Health-style uppercase small */
  .section-title {
    font-size: .72rem;
    letter-spacing: .08em;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  /* Bottom nav: taller, Health-style pill for active */
  .nav-btn.active .nav-icon svg {
    filter: drop-shadow(0 0 4px rgba(74,124,111,.4));
  }

  /* Empty state icon */
  .empty-icon svg { opacity: .3; }

  /* Admin tabs: Health-style pill active */
  .admin-tab.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    box-shadow: 0 3px 12px rgba(61,107,94,.28);
  }

  /* Stagger card animations */
  .card:nth-child(1)       { animation-delay: .03s; }
  .card:nth-child(2)       { animation-delay: .07s; }
  .card:nth-child(3)       { animation-delay: .11s; }
  .card:nth-child(4)       { animation-delay: .15s; }
  .list-item:nth-child(1)  { animation-delay: .02s; }
  .list-item:nth-child(2)  { animation-delay: .06s; }
  .list-item:nth-child(3)  { animation-delay: .10s; }
  .list-item:nth-child(4)  { animation-delay: .14s; }
  .list-item:nth-child(5)  { animation-delay: .18s; }
  .resident-row:nth-child(1){ animation-delay: .04s; }
  .resident-row:nth-child(2){ animation-delay: .09s; }
  .resident-row:nth-child(3){ animation-delay: .14s; }
  .stat-card:nth-child(1)  { animation-delay: .05s; }
  .stat-card:nth-child(2)  { animation-delay: .1s; }
  .stat-card:nth-child(3)  { animation-delay: .15s; }

  /* Smooth page-content swap */
  #nurseContent, #adminContent { transition: opacity .15s ease; }

  /* Login button: gradient */
  .btn-primary {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    box-shadow: 0 4px 16px rgba(74,124,111,.35);
    letter-spacing: .01em;
  }
  .btn-primary:active { transform: scale(.97); box-shadow: none; }

  /* Form inputs: clean white with focus glow */
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    box-shadow: 0 0 0 3px rgba(74,124,111,.15);
    border-color: var(--primary-mid);
  }

  /* Topbar: true frosted glass */
  .topbar {
    box-shadow: 0 .5px 0 rgba(0,0,0,.1);
  }


  /* ===== INTUITIVE FLOW ENHANCEMENTS ===== */

  /* Progress bar */
  .flow-progress { background: rgba(0,0,0,.1); border-radius: 20px; height: 9px; overflow: hidden; }
  .flow-progress-fill {
    height: 100%; border-radius: 20px;
    background: linear-gradient(90deg, #3A7D5C 0%, #2A9D8F 100%);
    transition: width .5s cubic-bezier(.34,1.56,.64,1);
  }

  /* Time context chip on round card */
  .time-ctx { display:inline-flex;align-items:center;gap:.25rem;padding:.22rem .65rem;border-radius:20px;font-size:.76rem;font-weight:700;margin-top:.5rem; }
  .time-ctx.current  { background:rgba(255,255,255,.3);  color:white; }
  .time-ctx.upcoming { background:rgba(255,255,255,.18); color:rgba(255,255,255,.85); }
  .time-ctx.past     { background:rgba(0,0,0,.2);        color:rgba(255,255,255,.65); }

  /* Round chip tabs */
  .round-chips { display:flex;gap:.4rem;margin-bottom:.85rem;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:.15rem;scrollbar-width:none; }
  .round-chips::-webkit-scrollbar { display:none; }
  .round-chip {
    display:flex;flex-direction:column;align-items:center;
    padding:.5rem .9rem;border-radius:14px;border:1.5px solid var(--border-light);
    background:white;cursor:pointer;white-space:nowrap;transition:all .18s;
    font-family:var(--font);flex-shrink:0;box-shadow:var(--shadow);
    -webkit-tap-highlight-color:transparent;
  }
  .round-chip .chip-time { font-size:.88rem;font-weight:700;color:var(--primary); }
  .round-chip .chip-name { font-size:.68rem;color:var(--text-muted);margin-top:.06rem; }
  .round-chip.done .chip-name::after { content:" ✓";color:var(--success); }
  .round-chip.active { background:var(--primary);border-color:var(--primary);box-shadow:0 4px 12px rgba(74,124,111,.3); }
  .round-chip.active .chip-time,
  .round-chip.active .chip-name { color:white; }
  .round-chip:active { transform:scale(.95); }

  /* Status dot per resident */
  .status-dot { width:10px;height:10px;border-radius:50%;flex-shrink:0;transition:background .3s; }
  .status-dot.pending  { background:var(--border); }
  .status-dot.partial  { background:#F0A500; }
  .status-dot.complete { background:var(--success); }
  .status-dot.skipped  { background:var(--skip); }

  /* Med action buttons with visual hierarchy */
  .med-action-row { display:flex;gap:.35rem; }
  .med-btn-given {
    flex:3;padding:.62rem .5rem;border-radius:11px;
    font-size:.92rem;font-weight:700;font-family:var(--font);cursor:pointer;min-height:48px;
    border:1.5px solid var(--success);background:var(--success-bg);color:var(--success);
    transition:all .15s;-webkit-tap-highlight-color:transparent;
  }
  .med-btn-given.active { background:var(--success);color:white;box-shadow:0 2px 10px rgba(58,125,92,.35); }
  .med-btn-given:active { transform:scale(.97); }
  .med-btn-skip {
    flex:1;padding:.6rem .4rem;border-radius:11px;
    font-size:.82rem;font-weight:600;font-family:var(--font);cursor:pointer;min-height:48px;
    border:1.5px solid var(--border-light);background:transparent;color:var(--text-muted);
    transition:all .15s;-webkit-tap-highlight-color:transparent;
  }
  .med-btn-skip.active { background:var(--skip-bg);color:var(--skip);border-color:var(--skip); }
  .med-btn-skip:active { transform:scale(.97); }

  /* Round complete banner */
  .round-complete-banner {
    background:linear-gradient(140deg,var(--success) 0%,#2A9D8F 100%);
    border-radius:var(--radius);padding:1.4rem 1.2rem;text-align:center;color:white;
    margin-bottom:1rem;box-shadow:0 4px 20px rgba(58,125,92,.3);
    animation:scaleIn .35s cubic-bezier(.34,1.56,.64,1);
  }
  .round-complete-banner .cpl-icon { font-size:2.4rem;margin-bottom:.35rem;line-height:1; }
  .round-complete-banner h3 { font-size:1.25rem;font-weight:800;margin-bottom:.3rem; }
  .round-complete-banner p { font-size:.85rem;opacity:.9; }

  /* Sticky finish button */
  .sticky-finish { position:sticky;bottom:calc(1.2rem + env(safe-area-inset-bottom));z-index:50;margin-top:.8rem; }
  .sticky-finish .btn-primary {
    background:linear-gradient(135deg,var(--success) 0%,#2A9D8F 100%) !important;
    box-shadow:0 4px 24px rgba(58,125,92,.45),0 2px 8px rgba(0,0,0,.15) !important;
    font-size:1rem;padding:.9rem;letter-spacing:.01em;
  }

  /* Login role cards */
  .login-roles { display:flex;gap:.6rem;margin-bottom:1.4rem; }
  .login-role-card {
    flex:1;padding:.9rem .5rem;border-radius:14px;
    border:2px solid var(--border-light);background:var(--bg);
    cursor:pointer;text-align:center;transition:all .18s;font-family:var(--font);
    -webkit-tap-highlight-color:transparent;
  }
  .login-role-card .role-icon {
    display:flex;justify-content:center;margin-bottom:.4rem;
    color:var(--text-muted);transition:color .18s;
  }
  .login-role-card .role-label { font-size:.9rem;font-weight:700;color:var(--text-secondary); }
  .login-role-card.active { border-color:var(--primary);background:var(--primary-light); }
  .login-role-card.active .role-label { color:var(--primary); }
  .login-role-card.active .role-icon { color:var(--primary); }
  .login-role-card:active { transform:scale(.97); }

  /* Note save button */
  .note-save-btn {
    padding:.35rem .7rem;border-radius:8px;
    border:1.5px solid var(--primary-mid);background:var(--primary-light);
    color:var(--primary);font-size:.8rem;font-weight:700;font-family:var(--font);
    cursor:pointer;white-space:nowrap;min-height:36px;
    transition:all .15s;-webkit-tap-highlight-color:transparent;flex-shrink:0;
  }
  .note-save-btn:active { transform:scale(.96); }
  .note-save-btn.saved { border-color:var(--success);background:var(--success-bg);color:var(--success); }

  /* Login redesign */
  #loginScreen {
    background: linear-gradient(160deg, var(--primary-light) 0%, #f0f8f5 55%, white 100%);
    padding: 1.5rem 1rem;
    align-items: center;
    justify-content: center;
  }
  .login-box {
    max-width: 360px;
    width: 100%;
    padding: 2rem 1.5rem 1.5rem;

    border-radius: 20px;
    background: white;
    box-shadow: 0 8px 40px rgba(45,139,116,.12);
  }
  .login-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 1.6rem;

  }
  .login-logo .icon {

  .login-logo .icon svg { width: 36px; height: 36px; }
  .login-logo h1 {

  .login-roles {

    padding: .3rem; border: 1.5px solid var(--border-light);
    border-radius: 12px; background: var(--primary-light);
  }
  .login-role-card {
    border-radius: 9px; min-height: 40px; padding: .5rem .4rem;
    border: 0; background: transparent; box-shadow: none;
    cursor: pointer; font-family: var(--font);
    -webkit-tap-highlight-color: transparent; transition: all .15s;
  }
  .login-role-card .role-icon { display: none; }
  .login-role-card .role-label { font-size: .86rem; font-weight: 600; color: var(--text-secondary); }
  .login-role-card.active {
    background: white;
    box-shadow: 0 1px 6px rgba(45,139,116,.15);
  }
  .login-role-card.active .role-label { color: var(--primary); font-weight: 700; }
  .login-role-card:active { transform: scale(.97); }
  .login-box .form-group { margin-bottom: .9rem; }
  .login-box .form-group label {
    font-size: .73rem; margin-bottom: .3rem;
    font-weight: 700; color: var(--text-secondary);
    text-transform: none; letter-spacing: 0;
  }
  .login-box .form-group input {
    min-height: 46px; border: 1.5px solid var(--border-light);

  .login-box .form-group input:focus {

  .login-box .btn-primary {
    margin-top: .4rem; min-height: 48px;

  .login-help { margin-top: .9rem; border-top: 1px solid var(--border-light); padding-top: .65rem; color: var(--text-muted); font-size: .74rem; }
  .login-help summary { cursor: pointer; list-style: none; text-align: center; font-weight: 700; color: var(--text-secondary); }
  .login-help summary::-webkit-details-marker { display: none; }
  .login-help-content { margin-top: .6rem; display: grid; gap: .35rem; text-align: center; line-height: 1.45; }
  #devTabBtn { background: none; border: none; color: var(--text-muted); opacity: .45; cursor: pointer; font-family: var(--font); font-size: .68rem; padding: .15rem .4rem; }

  /* ===== REFERENCE CLINICAL DASHBOARD LANGUAGE ===== */

    --primary-dark:  #004F52;
    --primary-light: #EEF9F8;
    --primary-mid:   #8BBFC1;
    --bg:            #FFFFFF;
    --bg2:           #F7FAFA;
    --card:          #FFFFFF;

    --success-bg:    #F5FBFA;
    --skip:          #F01822;

  /* ===== DESKTOP (≥769px) ===== */
  @media (min-width: 769px) {
    /* Layout: center everything in a max-width container */
    #app { max-width: 1100px; margin: 0 auto; }

    /* Topbar: remove safe-area padding, add subtle bottom border */
    .topbar { padding: .8rem 2rem; }

    /* Bottom nav: default sticky-top for old screens; nurse screen keeps it at bottom */
    .bottom-nav { position: sticky; top: 0; }
    #nurseScreen .bottom-nav { position: relative !important; top: auto !important; }

    /* Content: more breathing room, bigger max-width */
    .content { padding: 1.6rem 2rem; padding-bottom: 2rem; max-width: 860px; }
    .content-wide { padding: 1.6rem 2rem; }

    /* Nurse screen: keep bottom nav at bottom on desktop */
    #nurseScreen .bottom-nav {
      position: relative !important;
      top: auto !important;
      border-top: .5px solid var(--border-light);
      border-bottom: none;
    }
    #nurseScreen .content { max-width: 700px; margin: 0 auto; width: 100%; padding: 1.2rem 2rem; }
    #nurseBottomBar { max-width: 700px; margin: 0 auto; width: 100%; }

    /* Admin screen: full-width sidebar layout on desktop */
    #app { max-width: none !important; }
    #adminScreen {
      flex-direction: row !important;
      overflow: hidden;
      height: 100vh;
    }
    .admin-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    .admin-topbar-v2 {
      display: none !important;
    }
    .admin-sidebar {
      display: flex !important;
    }
    .admin-tab-bar {
      display: none !important;
    }
    .atb-more-wrap { display: none !important; }
    .admin-content-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 2rem 2.5rem;
      min-width: 0;
      max-width: 900px;
    }

    /* Modal: center on screen, not bottom sheet */
    .modal-overlay { align-items: center; }
    .modal-overlay.open .modal { animation: scaleIn .22s cubic-bezier(.22,1,.36,1); }
    .modal {
      border-radius: 20px !important;
      padding-bottom: 2rem !important;
      max-width: 560px;
      max-height: 85vh;
    }

    /* Admin tabs: wrap instead of scroll */
    .admin-tabs { flex-wrap: wrap; overflow-x: visible; }

    /* Hover states for admin action buttons */
    .admin-add-btn:hover { background: var(--primary); color: white; border-style: solid; }
    .admin-edit-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
    .admin-delete-btn:hover { background: var(--skip); color: white; border-color: var(--skip); }
    .admin-tab:hover:not(.active) { background: var(--primary-light); color: var(--primary); border-color: var(--primary-mid); }

    /* Hover states for other interactive elements */
    .nav-btn:hover { color: var(--primary); }
    .resident-row:hover { box-shadow: 0 3px 14px rgba(61,107,94,.15); }
    .list-item:hover { box-shadow: 0 3px 14px rgba(61,107,94,.15); }
    .card:hover { box-shadow: 0 3px 14px rgba(61,107,94,.12); }
    .btn-orange:hover { background: var(--primary-dark); }

    /* Cursor: pointer on all clickable elements */
    .resident-row[onclick], .list-item[onclick], .card[onclick] { cursor: pointer; }
  }

  /* ===== NEW INTUITIVE DESIGN v2 ===== */

  /* Updated color palette — warm teal matching mockup */

  #nurseScreen {
    flex-direction: column;

  }
  #nurseScreen .content {
    flex: 1;
    overflow-y: auto;

  /* Round header card v2 */
  .round-header-v2 {
    background: white;
    padding: .85rem 1rem .7rem;
    border-bottom: 1px solid var(--border-light);
    margin-bottom: .55rem;

  .round-selector-btn {

  /* Column headers */
  .res-col-hdrs {

  .res-row-v2.is-given   { border-color: #C8E6C9; background: #F8FFF8; }
  .res-row-v2.is-next    { border-right: 3px solid var(--accent-orange); }

  /* Resident info col */
  .res-info-col {
    display: flex;
    align-items: center;
    gap: .5rem;
    min-width: 0;
  }
  .res-avatar-sm {
    width: 34px; height: 34px;
    border-radius: 50%;

    border: 1.5px solid var(--primary-mid);

  .res-room-num {
    font-size: 1rem;

  .res-warn-tag {
    font-size: .67rem;
    color: var(--skip);
    display: flex;
    align-items: center;
    gap: .18rem;
    margin-top: .1rem;
  }

  /* Meds col */
  .res-meds-col { font-size: .78rem; color: var(--text-secondary); }
  .res-meds-toggle-btn {
    display: inline-flex;
    align-items: center;
    gap: .28rem;
    font-weight: 700;
    cursor: pointer;
    color: var(--text);
    font-size: .8rem;

    border: none;
    font-family: var(--font);
    padding: 0;
    text-align: right;
    -webkit-tap-highlight-color: transparent;
  }
  .mtb-chevron { color: var(--text-muted); transition: transform .2s; display:flex;align-items:center; }
  .res-meds-toggle-btn.open .mtb-chevron { transform: rotate(180deg); }

    margin-top: .35rem;

    display: flex;
    align-items: center;
    gap: .38rem;
  }

    width: 7px; height: 7px;
    border-radius: 50%;

  .rme-dot.given   { background: var(--success); }
  .rme-dot.skipped { background: var(--skip); }
  .rme-dot.pending { background: var(--border); }

  /* Status buttons col */
  .res-status-col {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: .28rem;
    min-width: 0;
  }
  .rsb-pair { display: flex; flex-direction: column; gap: .28rem; width: 100%; }

    display: flex;
    align-items: center;
    justify-content: center;
    gap: .22rem;
    padding: .38rem .3rem;
    border-radius: 9px;
    font-size: .76rem;
    font-weight: 700;
    font-family: var(--font);
    cursor: pointer;
    min-height: 36px;
    border: 2px solid transparent;
    transition: all .14s;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    line-height: 1;
    width: 100%;
  }
  .rsb:active { transform: scale(.94); }
  /* Unpressed: neutral grey, no colour hint */
  .rsb.given-btn         { background: var(--bg); color: var(--text-muted); border-color: var(--border-light); }
  .rsb.skip-btn          { background: var(--bg); color: var(--text-muted); border-color: var(--border-light); }
  /* Pressed: filled colour */
  .rsb.given-btn.active  { background: var(--success); color: white; border-color: var(--success); }
  .rsb.skip-btn.active   { background: var(--skip);    color: white; border-color: var(--skip); }

  .rsb.next    { background: var(--accent-orange); color: white; border-color: var(--accent-orange); }
  .rsb.pending { background: var(--bg); color: var(--text-muted); border-color: var(--border); }

  .rsb.skipped { background: transparent; color: var(--skip); border-color: var(--skip); }

  /* Bottom summary bar */
  .round-bottom-bar {

    border-top: 1px solid var(--border-light);

    display: flex; align-items: center; gap: .3rem;
    font-size: .72rem; color: var(--text-muted); font-family: var(--font);
    background: none; border: none; cursor: pointer; padding: 0; margin-top: .15rem;
    font-weight: 600;
  }
  .asb-logout:hover { color: var(--skip); }
  .asb-nurse-switch { margin-top: .2rem; font-size: .82rem; }

  .admin-topbar-v2 {
    background: white;
    border-bottom: 1px solid var(--border-light);
    padding: calc(.8rem + env(safe-area-inset-top)) 1.1rem .8rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 .5px 0 rgba(0,0,0,.08);
    flex-shrink: 0;
  }
  .admin-topbar-v2 .atb-brand {
    display: flex;
    align-items: center;
    gap: .45rem;
    font-size: .95rem;
    font-weight: 700;
    color: var(--primary);
  }
  .admin-topbar-v2 .atb-actions {
    display: flex;
    align-items: center;
    gap: .45rem;
  }
  .admin-topbar-v2 .atb-user {
    font-size: .78rem;
    color: var(--text-secondary);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: .3rem;
  }

  /* Admin tab bar — slim underline style */
  .admin-tab-bar {
    display: flex;
    overflow: visible;
    background: white;
    border-bottom: 1.5px solid var(--border-light);
    padding: 0 .8rem;
    flex-shrink: 0;
    position: sticky;
    top: calc(53px + env(safe-area-inset-top));
    z-index: 90;
  }
  /* Scrollable inner container — overflow lives here, not on the parent */
  .atb-scroll {
    display: flex;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    flex: 1;
    min-width: 0;
  }
  .atb-scroll::-webkit-scrollbar { display: none; }
  .atb-tab {
    padding: .7rem .85rem;
    border: none;
    border-bottom: 2.5px solid transparent;
    background: transparent;
    cursor: pointer;
    font-weight: 600;
    font-size: .83rem;
    white-space: nowrap;
    color: var(--text-muted);
    font-family: var(--font);
    margin-bottom: -1.5px;
    transition: color .18s, border-color .18s;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: center;
    gap: .3rem;
    min-height: 44px;
  }
  .atb-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .atb-tab:active { opacity: .7; }
  .atb-more-wrap { position: relative; margin-right: auto; }
  .atb-more-btn { gap: .25rem; }
  .atb-more-btn.menu-open { color: var(--primary); }
  .atb-more-menu {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: auto;
    background: white;
    border: 1.5px solid var(--border-light);
    border-radius: 12px;
    box-shadow: 0 6px 24px rgba(0,0,0,.12);
    min-width: 130px;
    max-width: calc(100vw - 16px);
    z-index: 200;
    overflow: hidden;
    animation: menuFadeIn .15s ease;
  }
  .atb-more-menu.open { display: block; }
  @keyframes menuFadeIn { from { opacity:0; transform: translateY(-4px); } to { opacity:1; transform: translateY(0); } }
  .atb-menu-item {
    display: block;
    width: 100%;
    padding: .75rem 1.1rem;
    border: none;
    background: transparent;
    font-family: var(--font);
    font-size: .85rem;
    font-weight: 600;
    color: var(--text-primary);
    text-align: right;
    cursor: pointer;
    border-bottom: 1px solid var(--border-light);
    -webkit-tap-highlight-color: transparent;
  }
  .atb-menu-item:last-child { border-bottom: none; }
  .atb-menu-item:active { background: var(--primary-light); }
  .atb-menu-item.active { color: var(--primary); background: var(--primary-light); }

  /* Admin main column (mobile = stacked, desktop = fills beside sidebar) */
  .admin-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: visible;
    min-width: 0;
  }

  /* Admin content wrapper */
  .admin-content-wrap {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: .9rem 1rem;
    padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
    background: var(--bg);
  }

  /* Admin section header */
  .adm-section-hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: .8rem;
  }
  .adm-section-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: .4rem;
  }
  .adm-section-sub {
    font-size: .75rem;
    color: var(--text-muted);
    margin-top: .12rem;
  }
  .adm-add-btn {
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    padding: .48rem .9rem;
    border-radius: 10px;
    border: none;
    background: var(--primary);
    color: white;
    font-size: .82rem;
    font-weight: 700;
    font-family: var(--font);
    cursor: pointer;
    white-space: nowrap;
    min-height: 38px;
    -webkit-tap-highlight-color: transparent;
    transition: background .15s;
  }
  .adm-add-btn:active { background: var(--primary-dark); }

  /* Admin search input */
  .adm-search {
    font-size: 14px !important;
    padding: .42rem .9rem;
    border: 1.5px solid var(--border-light);
    border-radius: 20px;
    font-family: var(--font);
    direction: rtl;
    width: 100%;
    background: white;
    margin-bottom: .7rem;
    display: block;
    transition: border-color .2s;
  }
  .adm-search:focus { outline: none; border-color: var(--primary-mid); }

  /* Admin list item v2 */
  .adm-list-item {
    background: white;
    border: 1px solid var(--border-light);
    border-radius: 14px;
    padding: .75rem .9rem;
    margin-bottom: .45rem;
    display: flex;
    align-items: center;
    gap: .7rem;
    transition: box-shadow .18s;
  }
  .adm-list-item:hover { box-shadow: 0 2px 10px rgba(45,139,116,.1); }
  .adm-item-body { flex: 1; min-width: 0; }
  .adm-item-title {
    font-weight: 700;
    font-size: .9rem;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .adm-item-sub { font-size: .75rem; color: var(--text-secondary); margin-top: .15rem; line-height: 1.5; }
  .adm-item-actions { display: flex; gap: .35rem; flex-shrink: 0; }
  .adm-edit-btn {
    padding: .38rem .7rem;
    border-radius: 8px;
    border: 1.5px solid var(--primary-mid);
    background: var(--primary-light);
    color: var(--primary);
    font-size: .78rem;
    font-weight: 700;
    font-family: var(--font);
    cursor: pointer;
    min-height: 36px;
    transition: all .12s;
    -webkit-tap-highlight-color: transparent;
  }
  .adm-edit-btn:active { background: var(--primary); color: white; }
  .adm-del-btn {
    padding: .38rem .7rem;
    border-radius: 8px;
    border: 1.5px solid #e5a0a0;
    background: #fff4f4;
    color: var(--skip);
    font-size: .78rem;
    font-weight: 700;
    font-family: var(--font);
    cursor: pointer;
    min-height: 36px;
    transition: all .12s;
    -webkit-tap-highlight-color: transparent;
  }
  .adm-del-btn:active { background: var(--skip); color: white; border-color: var(--skip); }

  /* Round card in admin */
  .adm-round-card {
    background: white;
    border: 1px solid var(--border-light);
    border-radius: 14px;
    margin-bottom: .5rem;
    overflow: hidden;
  }
  .adm-round-header {
    display: flex;
    align-items: center;
    gap: .7rem;
    padding: .8rem .9rem;
    border-bottom: 1px solid var(--border-light);
  }
  .adm-round-time-badge {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: var(--primary-light);
    flex-shrink: 0;
  }
  .adm-round-time-badge .badge-time { font-size: .82rem; font-weight: 800; color: var(--primary); line-height: 1.1; }
  .adm-round-time-badge .badge-icon { color: var(--primary); margin-bottom: .1rem; }
  .adm-round-entries { padding: .4rem .9rem .6rem; }
  .adm-round-entry-row {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .3rem 0;
    border-bottom: 1px solid var(--border-light);
    font-size: .82rem;
  }
  .adm-round-entry-row:last-child { border-bottom: none; }

  /* History entry v2 */
  .adm-hist-entry {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: .5rem;
    padding: .5rem 0;
    border-bottom: 1px solid var(--border-light);
  }
  .adm-hist-entry:last-child { border-bottom: none; }

  /* Admin stats summary at top */
  .adm-summary-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: .5rem;
    margin-bottom: 1rem;
  }
  .adm-sum-box {
    background: white;
    border: 1px solid var(--border-light);
    border-radius: 12px;
    padding: .7rem .5rem;
    text-align: center;
  }
  .adm-sum-val {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--primary);
    line-height: 1;
  }
  .adm-sum-label {
    font-size: .67rem;
    color: var(--text-muted);
    font-weight: 600;
    margin-top: .22rem;
    text-transform: uppercase;
    letter-spacing: .03em;
  }

  /* ===== PRINT — BLACK & WHITE ===== */
  @media print {
    .topbar, .bottom-nav, .admin-tabs, .admin-tab-bar, .btn, .btn-icon, .topbar-btn { display: none !important; }
    .content, #adminContent { padding: 0 !important; padding-bottom: 0 !important; }
    .screen { display: flex !important; }
    #adminScreen { display: block !important; }
    body { background: white !important; color: black !important; font-size: 11pt; }
    .card { box-shadow: none !important; border: 1px solid #999 !important; border-radius: 6px !important; break-inside: avoid; margin-bottom: 8pt !important; }
    /* Status indicators — pattern-based for B&W */
    [style*="success-bg"], [style*="var(--success-bg)"] { background: white !important; }
    [style*="skip-bg"],    [style*="var(--skip-bg)"]    { background: #eee !important; }
    [style*="#fff8e6"]                                   { background: #f5f5f5 !important; }
    /* Border-right status bar prints clearly */
    [style*="border-right:4px"] { border-right-width: 4px !important; border-right-style: solid !important; }
    [style*="border-right: 4px"] { border-right-width: 4px !important; }
    /* Dashed border for missing — prints as dashed */
    [style*="dashed"] { border-style: dashed !important; }
    /* Text status labels */
    span[style*="font-weight:700"][style*="color"] { color: black !important; }
    .card-title { font-size: 12pt !important; }
    @page { margin: 1.5cm; }
  }
</style>
</head>

// Fuzzy match: every character of q appears in order in s
function fuzzy(s, q) {
  if (!q) return true;
  s = s.toLowerCase(); q = q.toLowerCase();
  let si = 0;
  for (let qi = 0; qi < q.length; qi++) {
    si = s.indexOf(q[qi], si);
    if (si === -1) return false;
    si++;
  }
  return true;
}

const GH_REPO  = "gefenrose/medications";
const GH_FILE  = "data.json";
const GH_RAW   = `https://raw.githubusercontent.com/${GH_REPO}/main/${GH_FILE}`;

let _lastTs       = 0;     // last seen _ts from remote
let _pollInterval = null;
let _syncEnabled  = false;

// Reads via CDN raw URL — no auth, no API rate-limit, simpler decoding
async function ghRead() {
  try {
    const r = await fetch(GH_RAW + '?cb=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return null;
    return await r.json();
  } catch(e) { return null; }
}

function saveDataRemote() {
  showSyncBadge('✓ נשמר מקומית');
}

function mergeRemote(remote) {
  const prev = JSON.stringify({
    nurses: data.nurses, residents: data.residents, meds: data.meds,
    rounds: data.rounds, history: data.history,
    activeRoundSession: data.activeRoundSession
  });
  if (remote.nurses)    data.nurses    = remote.nurses;
  if (remote.residents) data.residents = remote.residents;
  if (remote.meds)      data.meds      = remote.meds;
  if (remote.rounds)    data.rounds    = remote.rounds;
  if (remote.history)   data.history   = remote.history;
  if (remote.activeRoundSession !== undefined) data.activeRoundSession = remote.activeRoundSession;
  localStorage.setItem('medtrack_data', JSON.stringify(data));
  const next = JSON.stringify({
    nurses: data.nurses, residents: data.residents, meds: data.meds,
    rounds: data.rounds, history: data.history,
    activeRoundSession: data.activeRoundSession
  });
  if (next !== prev) {
    showSyncBadge('↓ עודכן');
    rerenderCurrent();
  }
}

function startSync() {
  if (_pollInterval) return;
  _syncEnabled = true;
  _pollInterval = setInterval(async () => {
    if (!_syncEnabled) return;
    const remote = await ghRead();
    if (!remote) { showSyncBadge('✕ אין חיבור', true); return; }
    if ((remote._ts || 0) > _lastTs) {
      _lastTs = remote._ts;
      mergeRemote(remote);
    }
  }, 10000); // poll every 10s — raw CDN reads, no API rate-limit concern
}

function stopSync() {
  _syncEnabled = false;
  if (_pollInterval) { clearInterval(_pollInterval); _pollInterval = null; }
}

    el.style.color = warn ? '#856404' : 'var(--primary)';
    el.style.opacity = '1';
    setTimeout(() => { el.style.opacity = '0'; }, 2500);
  });
}

// ==================== SESSION PERSISTENCE ====================
const SESSION_KEY   = 'medtrack_session';
const ADMIN_TIMEOUT = 15 * 60 * 1000;   // 15 min in ms
let _adminIdleTimer = null;

function saveSession(user) {
  const session = {
    user,
    savedAt: Date.now(),
    type: user.type
  };
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch(e) {}
}

function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch(e) {}
}

function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const session = JSON.parse(raw);
    if (!session || !session.user) return null;
    // Admin: expire after 15 min from last save (covers app-close scenario)
    if (session.type === 'admin') {
      if (Date.now() - session.savedAt > ADMIN_TIMEOUT) {
        clearSession();
        return null;
      }
    }
    return session.user;
  } catch(e) { return null; }
}

function resetAdminIdleTimer() {
  if (!state.currentUser || state.currentUser.type !== 'admin') return;
  if (_adminIdleTimer) clearTimeout(_adminIdleTimer);
  // Bump savedAt so re-opens within 15 min still work
  saveSession(state.currentUser);
  _adminIdleTimer = setTimeout(() => {
    if (state.currentUser?.type === 'admin') {
      clearSession();
      doLogout();
    }
  }, ADMIN_TIMEOUT);
}

function stopAdminIdleTimer() {
  if (_adminIdleTimer) { clearTimeout(_adminIdleTimer); _adminIdleTimer = null; }
}

// Reset idle timer on any user interaction (admin only)
['click','touchstart','keydown','scroll'].forEach(evt =>
  document.addEventListener(evt, () => {
    if (state.currentUser?.type === 'admin') resetAdminIdleTimer();
  }, { passive: true })
);

// On visibility hidden: stamp the time (admin session expiry on re-open)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && state.currentUser?.type === 'admin') {
    saveSession(state.currentUser);  // stamp current time
  }
  if (document.visibilityState === 'visible') {
    // Re-check session validity when app comes back to foreground
    const saved = loadSession();
    if (!saved && state.currentUser) {
      // Session expired while in background
      doLogout();
    }
  }
});

// iOS PWA: pageshow fires on resume from background
window.addEventListener('pageshow', e => {
  if (!e.persisted) return;
  const saved = loadSession();
  if (!saved && state.currentUser) doLogout();
});

  state.loginType = type;
  document.querySelectorAll('.login-role-card').forEach((t,i) => t.classList.toggle('active',

  ));
  // Highlight dev button if selected
  const devBtn = document.getElementById('devTabBtn');
  if (devBtn) devBtn.style.opacity = type === 'dev' ? '0.8' : '0.25';
  document.getElementById('loginUsername').placeholder =
    type === 'admin' ? 'הכנס שם משתמש מנהל' :
    type === 'dev'   ? 'dev username' : 'הכניסי שם משתמש';
}
function doLogin() {
  const u = document.getElementById('loginUsername').value.trim().toLowerCase();
  const p = document.getElementById('loginPassword').value.trim().toLowerCase();
  const err = document.getElementById('loginError');
  err.style.display = 'none';
  if (state.loginType === 'admin' || state.loginType === 'dev') {
    if (u === 'developer' && p === 'dev1234') {
      state.currentUser = { type: 'dev', name: 'Developer' };
      saveSession(state.currentUser);
      showScreen('adminScreen');
      document.getElementById('adminTitle').textContent = '⚙ Developer Mode';
      adminTab('rounds');
      ghRead().then(remote => {
        if (remote) {
          if (remote.nurses)   data.nurses   = remote.nurses;
          if (remote.residents) data.residents = remote.residents;
          if (remote.meds)     data.meds      = remote.meds;
          if (remote.rounds)   data.rounds    = remote.rounds;
          if (remote.history)  data.history   = remote.history;
          if (remote.activeRoundSession !== undefined) data.activeRoundSession = remote.activeRoundSession;
          localStorage.setItem('medtrack_data', JSON.stringify(data));
          renderAdminContent();
        }
      });
      startSync();
    } else if ((()=>{ const cr=getAdminCreds(); return u===cr.username.toLowerCase() && p===cr.password.toLowerCase(); })()) {
      const cr = getAdminCreds();
      state.currentUser = {
        type: 'admin',
        name: cr.name || 'מנהל',
        displayName: cr.displayName || cr.name || 'מנהל'
      };
      saveSession(state.currentUser);
      resetAdminIdleTimer();
      showScreen('adminScreen');
      applyAdminProfileToChrome();
      adminTab('rounds');
      // Load latest from Firebase first
      ghRead().then(remote => {
        if (remote) {
          if (remote.nurses) data.nurses = remote.nurses;
          if (remote.residents) data.residents = remote.residents;
          if (remote.meds) data.meds = remote.meds;
          if (remote.rounds) data.rounds = remote.rounds;
          if (remote.history) data.history = remote.history;
          if (remote.activeRoundSession !== undefined) data.activeRoundSession = remote.activeRoundSession;
          localStorage.setItem('medtrack_data', JSON.stringify(data));
          renderAdminContent();
        }
      });
      startSync();
    } else { err.style.display = 'block'; }
  } else {
    const nurse = data.nurses.find(n => n.username.toLowerCase() === u && n.password.toLowerCase() === p);
    if (nurse) {
      state.currentUser = { type: 'nurse', name: nurse.name, id: nurse.id };
      state.selectedDate = new Date().toISOString().split('T')[0];
      saveSession(state.currentUser);
      // Schedule notifications after data loads
      setTimeout(() => scheduleRoundNotifications(), 2000);
      showScreen('nurseScreen');
      document.getElementById('nurseTitle').textContent = 'חלוקת תרופות';
      const ui = document.getElementById('nurseUserInfo');
      ui.querySelector('strong').textContent = nurse.name;
      ui.querySelector('span').textContent = 'שלום, ' + nurse.name.split(' ')[0];
      // Load latest from Firebase
      ghRead().then(remote => {
        if (remote) {
          if (remote.nurses) data.nurses = remote.nurses;
          if (remote.residents) data.residents = remote.residents;
          if (remote.meds) data.meds = remote.meds;
          if (remote.rounds) data.rounds = remote.rounds;
          if (remote.history) data.history = remote.history;
          if (remote.activeRoundSession !== undefined) data.activeRoundSession = remote.activeRoundSession;
          localStorage.setItem('medtrack_data', JSON.stringify(data));
        }
        nurseTab('round');
      }).catch(() => nurseTab('round'));
      startSync();
    } else { err.style.display = 'block'; }
  }
}
function doLogout() {
  stopSync();
  stopAdminIdleTimer();
  clearSession();
  state.currentUser = null;
  showScreen('loginScreen');
  document.getElementById('loginUsername').value = '';

const ADMIN_OVERFLOW_TABS = new Set(['residents','nurses','history','profile']);
function toggleAdminMoreMenu(e) {
  e.stopPropagation();
  const menu = document.getElementById('atbMoreMenu');
  const btn  = document.getElementById('atbMoreBtn');
  const open = menu.classList.toggle('open');
  btn.classList.toggle('menu-open', open);
  document.getElementById('atbMoreChevron').style.transform = open ? 'rotate(180deg)' : '';
  if (open) {
    setTimeout(() => document.addEventListener('click', _closeAdminMoreOnOutside, { once: true }), 0);
  }
}
function _closeAdminMoreOnOutside() { closeAdminMoreMenu(); }
function closeAdminMoreMenu() {
  const menu = document.getElementById('atbMoreMenu');
  const btn  = document.getElementById('atbMoreBtn');
  if (!menu) return;
  menu.classList.remove('open');
  btn && btn.classList.remove('menu-open');
  const chev = document.getElementById('atbMoreChevron');
  if (chev) chev.style.transform = '';
}

function adminTab(tab) {
  state.adminTab = tab;
  state.adminSearch = { residents: '', meds: '', nurses: '' };
  closeAdminMoreMenu();
  // Mobile tab bar
  document.querySelectorAll('.atb-tab[data-tab]').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.atb-menu-item[data-tab]').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  // Desktop sidebar
  document.querySelectorAll('.asb-nav-item[data-tab]').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  // Show "עוד" button as active when an overflow tab is selected
  const moreBtn = document.getElementById('atbMoreBtn');
  if (moreBtn) moreBtn.classList.toggle('active', ADMIN_OVERFLOW_TABS.has(tab));
  // Update "עוד" label to show selected overflow tab name, or reset
  const moreLabel = document.getElementById('atbMoreLabel');
  if (moreLabel) {
    if (ADMIN_OVERFLOW_TABS.has(tab)) {
      const item = document.querySelector(`.atb-menu-item[data-tab="${tab}"]`);
      moreLabel.textContent = item ? item.textContent.trim() : 'עוד';
    } else {
      moreLabel.textContent = 'עוד';
    }
  }
  const adminEl = document.getElementById('adminContent');
  if (adminEl) {
    adminEl.style.opacity = '0';
    adminEl.style.transition = 'opacity .1s';
    setTimeout(() => {
      renderAdminContent();
      adminEl.style.opacity = '1';
      adminEl.scrollTop = 0;
    }, 80);
  } else {
    renderAdminContent();
  }
}

function renderAdminContent() {
  const el = document.getElementById('adminContent');
  switch(state.adminTab) {
    case 'rounds': el.innerHTML = renderAdminRounds(); break;
    case 'residents': el.innerHTML = renderAdminResidents(); break;
    case 'meds': el.innerHTML = renderAdminMeds(); break;
    case 'nurses': el.innerHTML = renderAdminNurses(); break;
    case 'history': el.innerHTML = renderAdminHistory(); break;
    case 'export': el.innerHTML = renderAdminExport(); break;
    case 'profile': if (state.currentUser?.type === 'dev') { adminTab('rounds'); return; } el.innerHTML = renderAdminProfile(); break;
  }
}

function openRoundModal(id) {  if (state.currentUser?.type === 'dev') return;

  state.editId = id || null;
  const round = id ? data.rounds.find(r=>r.id===id) : null;
  openModal(id ? 'עריכת סבב' : 'סבב חדש', buildRoundForm(round));
}
function buildRoundForm(round) {
  const entries = round ? round.entries : [];
  let resOptions = data.residents.map(r => `<option value="${r.id}">${esc(r.name)} (חדר ${r.room})</option>`).join('');
  let medOptions = data.meds.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('');
  window._resOptions = resOptions;
  window._medOptions = medOptions;
  let entriesHtml = '';
  entries.forEach((e,i) => {
    entriesHtml += buildEntryRow(i, e.residentId, e.medIds, e.notes, resOptions, medOptions);
  });
  return `
    <div class="form-group"><label>שם הסבב</label><input id="rf_name" value="${round ? esc(round.name) : ''}"></div>
    <div class="form-group"><label>שעה</label><input id="rf_time" type="time" value="${round ? round.time : '08:00'}"></div>
    <div style="margin-bottom:.5rem;font-weight:700">דיירים בסבב</div>
    <div style="display:flex;gap:.5rem;margin-bottom:.8rem">
      <button class="btn btn-orange" onclick="saveRound()" style="flex:1">שמור</button>
      <button class="btn btn-outline" onclick="addEntryRow()">+ הוסף דייר</button>
    </div>
    <div id="entriesContainer">${entriesHtml}</div>
  `;
}
function buildEntryRow(i, resId, medIds, notes, resOpts, medOpts) {
  const ro = resOpts || window._resOptions || '';
  const resMeds = resId ? (data.residents.find(r=>r.id===resId)||{}).meds||[] : [];
  const medsToShow = resMeds.length>0 ? data.meds.filter(m=>resMeds.includes(m.id)) : data.meds;
  const medPills = medsToShow.map(m => {
    const sel = medIds && medIds.includes(m.id) ? ' selected' : '';

function resizeResidentPhoto(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('לא ניתן לקרוא את התמונה'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('קובץ התמונה לא תקין'));
      img.onload = () => {
        const max = 360;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.78));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
