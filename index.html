// ── PDF Export via browser print ─────────────────────────────────────────
function exportPDF(fromDate, toDate) {
  const DAYS_HE = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  function heDate(dateStr) {
    const dt = new Date(dateStr+'T12:00:00');
    const d = String(dt.getDate()).padStart(2,'0');
    const m = String(dt.getMonth()+1).padStart(2,'0');
    return `יום ${DAYS_HE[dt.getDay()]}, ${d}/${m}/${dt.getFullYear()}`;
  }

  const hist   = data.history   || [];
  const resArr = data.residents || [];
  const rndArr = data.rounds    || [];
  const medArr = data.meds      || [];
  const rName  = id => (resArr.find(r=>r.id===id)||{}).name||'?';
  const mInfo  = id => { const m=medArr.find(m=>m.id===id); return m?m.name+' '+m.dose:id; };

  const dayHist = hist.filter(h=>{
    const d=(h.date||'').split('T')[0];
    return (!fromDate||d>=fromDate)&&(!toDate||d<=toDate);
  });
  const allDates=[...new Set(dayHist.map(h=>(h.date||'').split('T')[0]))].sort();
  const sortedR=[...rndArr].sort((a,b)=>(a.time||'').localeCompare(b.time||''));

  let body = '';

  if (!allDates.length) {
    body = '<p style="color:#666">אין נתונים בטווח שנבחר.</p>';
  } else {
    allDates.forEach(date => {
      const dh = dayHist.filter(h=>(h.date||'').startsWith(date));
      const doneMap={};
      dh.forEach(h=>{ doneMap[h.residentId+'_'+h.medId+'_'+h.roundId]=h; });

      body += `<h2 class="date-head">${heDate(date)}</h2>`;

      sortedR.forEach(rnd=>{
        const entries=rnd.entries||[];
        const exp=[];
        entries.forEach(entry=>{
          (entry.medIds||[]).forEach(mid=>{
            const key=entry.residentId+'_'+mid+'_'+rnd.id;
            exp.push({resId:entry.residentId,mid,h:doneMap[key]||null});
          });
        });
        if (!exp.length) return;

        const gN=exp.filter(e=>e.h&&e.h.status==='given').length;
        const sN=exp.filter(e=>e.h&&e.h.status==='skipped').length;
        const mN=exp.filter(e=>!e.h).length;

        body += `<div class="round-block">
          <div class="round-head">
            <span class="round-name">${rnd.name||''} — ${rnd.time||''}</span>
            <span class="counts">[v]:${gN} &nbsp; [x]:${sN} &nbsp; [!]:${mN}</span>
          </div>`;

        exp.forEach(({resId,mid,h})=>{
          const rn=rName(resId);
          const mfull=mInfo(mid);
          const nurse=h?(h.nurseName||''):'';
          const atime=h?(h.time||''):'';
          const note=h?(h.note||''):'';
          let sym,cls;
          if (h&&h.status==='given')     {sym='[v]';cls='given';}
          else if (h&&h.status==='skipped'){sym='[x]';cls='skipped';}
          else                             {sym='[!]';cls='missing';}
          body += `<div class="row ${cls}">
            <span class="sym">${sym}</span>
            <span class="res">${rn}</span>
            <span class="med">${mfull}</span>
            <span class="nurse-block">
              ${nurse ? `<span class="nurse-name">${nurse}</span>` : ''}
              ${atime ? `<span class="atime">${atime}</span>` : `<span class="missing-nurse">—</span>`}
            </span>
            ${note ? `<span class="note">* ${note}</span>` : ''}
          </div>`;
        });
        body += '</div>';
      });
    });
  }

  const dr = (fromDate&&toDate)?fromDate+' — '+toDate:new Date().toLocaleDateString('he-IL');

  const html = `<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<title>מעקב תרופות</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family: 'Arial Hebrew','Arial','Times New Roman',serif;
    font-size: 11pt;
    direction: rtl;
    color: #000;
    background: #fff;
    padding: 15mm 15mm 10mm;
  }

  /* ── Header ── */
  h1 { font-size:16pt; font-weight:bold; margin-bottom:1mm; }
  .subtitle { font-size:9pt; font-style:italic; margin-bottom:4mm; }
  hr { border:none; border-top:1pt solid #000; margin-bottom:6mm; }

  /* ── Date heading ── */
  h2.date-head {
    font-size:12pt;
    font-weight:bold;
    text-decoration:underline;
    margin:6mm 0 2mm;
  }

  /* ── Round block ── */
  .round-block { margin-bottom:4mm; page-break-inside:avoid; }
  .round-head {
    display:flex; justify-content:space-between; align-items:baseline;
    border-top:1pt solid #000;
    border-bottom:0.5pt solid #000;
    padding:1mm 1mm;
    margin-bottom:1mm;
  }
  .round-name { font-weight:bold; font-size:10.5pt; }
  .counts { font-size:8pt; direction:ltr; font-style:italic; }

  /* ── Data rows ── */
  .row {
    display:flex; align-items:baseline; gap:3mm;
    padding:0.7mm 1mm;
    border-bottom:0.15pt solid #aaa;
    font-size:9.5pt;
  }

  /* Status symbol — bold, fixed width */
  .sym { font-weight:bold; min-width:8mm; font-size:9.5pt; }

  /* Resident name — bold */
  .res { font-weight:bold; min-width:28mm; }

  /* Med name+dose — normal */
  .med { min-width:28mm; }

  /* Nurse+time block */
  .nurse-block { display:inline-flex; align-items:baseline; gap:2mm; margin-right:auto; }

  /* Nurse name — italic underline */
  .nurse-name { font-style:italic; text-decoration:underline; font-size:9pt; }

  /* Actual time — bold */
  .atime { font-weight:bold; font-size:10pt; }

  /* Missing ── */
  .row.missing .sym { font-weight:bold; }
  .row.missing .res { text-decoration:line-through; }  /* visual cue: not acted on */
  .missing-nurse { font-style:italic; font-size:8pt; color:#555; }

  /* Note */
  .note { font-style:italic; font-size:8pt; color:#444; }

  /* ── Legend ── */
  .legend { margin-top:8mm; border-top:0.8pt solid #000; padding-top:4mm; page-break-before:always; }
  .legend h3 { font-size:11pt; font-weight:bold; text-decoration:underline; margin-bottom:3mm; }
  .legend-row { display:flex; gap:4mm; margin-bottom:2mm; font-size:9.5pt; align-items:baseline; }
  .legend-sym { font-weight:bold; min-width:14mm; }

  @media print {
    body { padding:10mm; }
    .round-block { page-break-inside:avoid; }
    @page { margin:1.5cm; }
  }
</style>
</head>
<body>
<h1>מעקב תרופות  דיור מוגן</h1>
<p class="subtitle">${dr}</p>
<hr>
${body}
<div class="legend">
  <h3>מקרא</h3>

  <div class="legend-row">
    <span class="legend-sym">[v]</span>
    <span><strong>ניתנה</strong> — התרופה ניתנה לדייר</span>
  </div>
  <div class="legend-row">
    <span class="legend-sym">[x]</span>
    <span><strong>דולג</strong> — התרופה דולגה</span>
  </div>
  <div class="legend-row">
    <span class="legend-sym">[!]</span>
    <span><strong><s>שם דייר</s></strong> — לא סומן — לא נרשמה פעולה</span>
  </div>

  <hr style="border:none;border-top:0.4pt solid #999;margin:3mm 0">
  <p style="font-size:9pt;font-weight:bold;margin-bottom:2mm">עמודות בכל שורה:</p>

  <div class="legend-row">
    <span class="legend-sym" style="min-width:8mm">[סטטוס]</span>
    <span><strong>שם דייר</strong></span>
    <span>תרופה ומינון</span>
    <span><em style="text-decoration:underline">מדריכה</em></span>
    <span><strong>שעה בפועל</strong></span>
  </div>

  <hr style="border:none;border-top:0.4pt solid #999;margin:3mm 0">
  <p style="font-size:9pt;font-weight:bold;margin-bottom:2mm">אמצעי הדגשה:</p>
  <div class="legend-row"><span style="min-width:32mm"><strong>Bold</strong></span><span>שם דייר, סטטוס, שעת נתינה בפועל</span></div>
  <div class="legend-row"><span style="min-width:32mm"><em style="text-decoration:underline">Italic + קו תחתון</em></span><span>שם המדריכה שנתנה את התרופה</span></div>
  <div class="legend-row"><span style="min-width:32mm"><s>Strikethrough</s></span><span>שם דייר שתרופתו לא סומנה [!]</span></div>
  <div class="legend-row"><span style="min-width:32mm"><em>Italic</em></span><span>הערות, תיאור כללי</span></div>
</div>
</body>
</html>`;

  // Open in new tab and trigger print
  const win = window.open('', '_blank');
  if (!win) { alert('אפשרי חלונות popup בדפדפן'); return; }
  win.document.write(html);
  win.document.close();
  win.focus();
  setTimeout(() => { win.print(); }, 400);
}

function exportPDFRange() {
  if (state.currentUser?.type === 'dev') return; const from = document.getElementById('pdf_from')?.value || '';
  const to   = document.getElementById('pdf_to')?.value   || '';
  exportExcel(from, to);
}

function exportExcel(fromDate, toDate) {
  if (state.currentUser?.type === 'dev') return; if (typeof XLSX === 'undefined') {
    alert('טוען את ספריית Excel... נסה שוב בעוד שנייה');
    return;
  }

  const wb   = XLSX.utils.book_new();
  const today = new Date().toISOString().split('T')[0];

  // ── Sheet 1: Complete log — all expected meds + status (incl. missing) ──

  // Collect all dates that are in range AND have any round data
  const histDates = new Set(data.history.map(h => (h.date||'').split('T')[0]));
  // Also include today so unsanked today appear
  histDates.add(today);
  const allLogDates = [...histDates].filter(d =>
    (!fromDate || d >= fromDate) && (!toDate || d <= toDate)
  ).sort();

  const logHeaders = ['תאריך','שעת סבב','שם סבב','שם מדריכה','שם דייר','תרופה','מינון','שעת נתינה בפועל','סטטוס','הערות'];
  const logData = [logHeaders];
  const logStatus = [null]; // track status per row for coloring

  const sortedRoundsL = [...data.rounds].sort((a,b)=>(a.time||'').localeCompare(b.time||''));

  allLogDates.forEach(date => {
    const dayH = data.history.filter(h => (h.date||'').startsWith(date));
    const doneMap = {};
    dayH.forEach(h => { doneMap[h.residentId+'_'+h.medId+'_'+h.roundId] = h; });

    sortedRoundsL.forEach(round => {
      (round.entries||[]).forEach(entry => {
        const res = data.residents.find(r=>r.id===entry.residentId);
        if (!res) return;
        (entry.medIds||[]).forEach(medId => {
          const med   = data.meds.find(m=>m.id===medId);
          const key   = entry.residentId+'_'+medId+'_'+round.id;
          const h     = doneMap[key] || null;
          const status = h
            ? (h.status === 'given' ? '✓ ניתנה' : '✕ דולג')
            : '⚠ לא סומן';
          logData.push([
            new Date(date+'T12:00:00').toLocaleDateString('he-IL'),
            round.time || '',
            round.name || '',
            h ? (h.nurseName||'') : '',
            res.name,
            med ? med.name : medId,
            med ? (med.dose||'') : '',
            h ? (h.time||'') : '',
            status,
            h ? (h.note||'') : ''
          ]);
          logStatus.push(h ? h.status : 'missing');
        });
      });
    });
  });

  const ws1 = XLSX.utils.aoa_to_sheet(logData);
  ws1['!views'] = [{ rightToLeft: true }];
  ws1['!cols'] = [
    {wch:13},{wch:9},{wch:14},{wch:15},{wch:15},{wch:16},{wch:9},{wch:13},{wch:11},{wch:22}
  ];

  // Header row style
  logData[0].forEach((_, ci) => {
    const addr = XLSX.utils.encode_cell({r:0, c:ci});
    if (ws1[addr]) ws1[addr].s = { font:{bold:true}, fill:{fgColor:{rgb:'D9E8E4'}}, alignment:{horizontal:'center'} };
  });

  // Status column coloring + missing row highlight
  for (let ri = 1; ri < logData.length; ri++) {
    const st = logStatus[ri];
    const statusAddr = XLSX.utils.encode_cell({r:ri, c:8});
    const cell = ws1[statusAddr];
    if (!cell) continue;
    if (st === 'given') {
      cell.s = { font:{bold:true, color:{rgb:'1A5C34'}}, fill:{fgColor:{rgb:'E8F5EE'}} };
    } else if (st === 'skipped') {
      cell.s = { font:{bold:true, color:{rgb:'7B1C1C'}}, fill:{fgColor:{rgb:'F9EAEA'}} };
    } else {
      // Missing — amber, mark whole row lightly
      cell.s = { font:{bold:true, color:{rgb:'7A4F00'}}, fill:{fgColor:{rgb:'FFF3CD'}} };
      [0,1,2,3,4,5,6,7,9].forEach(ci => {
        const a = XLSX.utils.encode_cell({r:ri, c:ci});
        if (!ws1[a]) ws1[a] = {v:'', t:'s'};
        ws1[a].s = { fill:{fgColor:{rgb:'FFFBF0'}} };
      });
    }
  }

  XLSX.utils.book_append_sheet(wb, ws1, 'רשומות חלוקה');

  // ── Sheet 2: Missing meds summary ─────────────────────────────────────
  // For each date+round, list every expected med and its status (including missing)
  const allDates = [...new Set([
    ...data.history.map(h => h.date.split('T')[0]),
    today
  ])].filter(d => (!fromDate || d >= fromDate) && (!toDate || d <= toDate)).sort();

  const sumHeaders = ['תאריך','שעת סבב','שם סבב','שם דייר','תרופה','מינון','סטטוס','שם מדריכה','שעת נתינה','הערות'];
  const sumData = [sumHeaders];

  allDates.forEach(date => {
    const dayHistory = data.history.filter(h => h.date && h.date.startsWith(date));
    const doneMap = {};
    dayHistory.forEach(h => { doneMap[h.residentId + '_' + h.medId + '_' + h.roundId] = h; });

    const sortedRounds = data.rounds.slice().sort((a,b) => a.time.localeCompare(b.time));
    sortedRounds.forEach(round => {
      (round.entries || []).forEach(entry => {
        const res = data.residents.find(r => r.id === entry.residentId);
        if (!res) return;
        (entry.medIds || []).forEach(medId => {
          const med = data.meds.find(m => m.id === medId);
          const key = entry.residentId + '_' + medId + '_' + round.id;
          const h   = doneMap[key];
          const status = h
            ? (h.status === 'given' ? '✓ ניתנה' : '✕ דולג')
            : '⚠ לא סומן';
          sumData.push([
            new Date(date + 'T12:00:00').toLocaleDateString('he-IL'),
            round.time,
            round.name,
            res.name,
            med?.name || '',
            med?.dose || '',
            status,
            h?.nurseName || '',
            h?.time      || '',
            h?.note      || ''
          ]);
        });
      });
    });
  });

  const ws2 = XLSX.utils.aoa_to_sheet(sumData);
  ws2['!views'] = [{ rightToLeft: true }];
  ws2['!cols'] = [
    {wch:13},{wch:9},{wch:14},{wch:15},{wch:16},{wch:9},{wch:12},{wch:15},{wch:12},{wch:22}
  ];

  // Header style
  sumData[0].forEach((_, ci) => {
    const addr = XLSX.utils.encode_cell({r:0, c:ci});
    if (ws2[addr]) ws2[addr].s = { font:{bold:true}, fill:{fgColor:{rgb:'D9E8E4'}}, alignment:{horizontal:'center'} };
  });

  // Color every row by status
  for (let ri = 1; ri < sumData.length; ri++) {
    const statusVal  = sumData[ri][6]; // col 6 = סטטוס
    const statusAddr = XLSX.utils.encode_cell({r:ri, c:6});
    const cell = ws2[statusAddr];
    if (!cell) continue;
    if (statusVal.includes('ניתנה')) {
      cell.s = { font:{bold:true, color:{rgb:'1A5C34'}}, fill:{fgColor:{rgb:'E8F5EE'}} };
    } else if (statusVal.includes('דולג')) {
      cell.s = { font:{bold:true, color:{rgb:'7B1C1C'}}, fill:{fgColor:{rgb:'F9EAEA'}} };
    } else {
      // Missing — bold, dark amber, striped bg
      cell.s = { font:{bold:true, color:{rgb:'7A4F00'}}, fill:{fgColor:{rgb:'FFF3CD'}} };
      // Also mark entire row cols lightly
      [0,1,2,3,4,5].forEach(ci => {
        const a = XLSX.utils.encode_cell({r:ri, c:ci});
        if (ws2[a]) ws2[a].s = { fill:{fgColor:{rgb:'FFFBF0'}} };
      });
    }
  }

  XLSX.utils.book_append_sheet(wb, ws2, 'מעקב מלא כולל חסרים');

  const dateLabel = fromDate && toDate
    ? `${fromDate}_${toDate}`
    : today;
  XLSX.writeFile(wb, `מעקב-תרופות-${dateLabel}.xlsx`);
}

function openModal(title, body) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalOverlay').classList.add('open');
  // Set resident selects after DOM is rendered
  setTimeout(() => {
    const round = state.editId ? data.rounds.find(r=>r.id===state.editId) : null;
    if (round) {
      round.entries.forEach((e,i) => {
        const sel = document.getElementById('entry_res_'+i);
        if (sel) sel.value = e.residentId;
      });
    }

// ==================== PUSH NOTIFICATIONS ====================

let _scheduledNotifs = {};  // roundId -> timeoutId

async function requestNotifPermission() {
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') return false;
  const result = await Notification.requestPermission();
  return result === 'granted';
}

function scheduleRoundNotifications() {
  // Cancel existing
  Object.values(_scheduledNotifs).forEach(id => clearTimeout(id));
  _scheduledNotifs = {};

  if (!data.rounds || !data.rounds.length) return;
  if (Notification.permission !== 'granted') return;

  const now = new Date();
  const todayStr = now.toISOString().split('T')[0];

  data.rounds.forEach(round => {
    // Skip globally disabled or per-round muted
    if (!state.remindersEnabled) return;
    if (state.mutedRounds[round.id]) return;

    const [hh, mm] = round.time.split(':').map(Number);
    const fireAt = new Date(now);
    fireAt.setHours(hh, mm, 0, 0);

    const msUntil = fireAt - now;
    if (msUntil < -60000) return;
    if (msUntil < 0) {
      triggerRoundNotification(round);
      return;
    }

    _scheduledNotifs[round.id] = setTimeout(() => {
      triggerRoundNotification(round);
    }, msUntil);
  });
}

function triggerRoundNotification(round) {
  if (Notification.permission !== 'granted') return;

  const names = (round.entries || []).map(e => {
    const res = data.residents.find(r => r.id === e.residentId);
    return res ? res.name : null;
  }).filter(Boolean);

  if (!names.length) return;

  const body = names.join(' · ');

  // Use SW notification if available (works when app is backgrounded)
  if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({
      type: 'SHOW_NOTIFICATION',
      title: `${round.name} — ${round.time}`,
      body,
      tag: `round-${round.id}-${new Date().toISOString().split('T')[0]}`
    });
  } else {
    // Fallback: direct Notification API
    new Notification(`💊 ${round.name} — ${round.time}`, {
      body,
      icon: './icons/icon-192.png',
      badge: './icons/icon-192.png',
      tag: `round-${round.id}-${new Date().toISOString().split('T')[0]}`,
      renotify: false
    });
  }
}

async function enableNotifications() {
  const granted = await requestNotifPermission();
  if (!granted) {
    alert('ההרשאה נדחתה. אנא אפשרי התראות בהגדרות הדפדפן.');
    return;
  }
  scheduleRoundNotifications();
  renderNurseContent();
}

function disableNotifications() {
  state.remindersEnabled = false;
  Object.values(_scheduledNotifs).forEach(id => clearTimeout(id));
  _scheduledNotifs = {};
  renderNurseContent();
}

function toggleGlobalNotif(enabled) {
  state.remindersEnabled = enabled;
  if (enabled) {
    scheduleRoundNotifications();
  } else {
    Object.values(_scheduledNotifs).forEach(id => clearTimeout(id));
    _scheduledNotifs = {};
  }
  renderNurseContent();
}

function testNotification(roundId) {
  const round = data.rounds.find(r => r.id === roundId);
  if (!round) return;
  triggerRoundNotification(round);
}

function toggleRoundNotif(roundId, mute) {
  if (mute) {
    state.mutedRounds[roundId] = true;
    if (_scheduledNotifs[roundId]) {
      clearTimeout(_scheduledNotifs[roundId]);
      delete _scheduledNotifs[roundId];
    }
  } else {
    delete state.mutedRounds[roundId];
    // Re-schedule just this round
    if (state.remindersEnabled && Notification.permission === 'granted') {
      const round = data.rounds.find(r => r.id === roundId);
      if (round) {
        const now = new Date();
        const [hh, mm] = round.time.split(':').map(Number);
        const fireAt = new Date(now);
        fireAt.setHours(hh, mm, 0, 0);
        const msUntil = fireAt - now;
        if (msUntil > 0) {
          _scheduledNotifs[roundId] = setTimeout(() => triggerRoundNotification(round), msUntil);
        }
      }
    }
  }
  renderNurseContent();
}

// ── Auto-restore session on app open ──────────────────────────────────────
(function restoreSession() {
  const saved = loadSession();
  if (!saved) return;

  state.currentUser = saved;

  if (saved.type === 'admin' || saved.type === 'dev') {
    showScreen('adminScreen');
    adminTab('rounds');
    resetAdminIdleTimer();
    // Load fresh data from GitHub
    ghRead().then(remote => {
      if (remote) {
        if (remote.nurses)   data.nurses   = remote.nurses;
        if (remote.residents) data.residents = remote.residents;
        if (remote.meds)     data.meds      = remote.meds;
        if (remote.rounds)   data.rounds    = remote.rounds;
        if (remote.history)  data.history   = remote.history;
        if (remote.activeRoundSession !== undefined) data.activeRoundSession = remote.activeRoundSession;
        localStorage.setItem('medtrack_data', JSON.stringify(data));
        renderAdminContent();
      }
    });
    startSync();
  } else if (saved.type === 'nurse') {
    showScreen('nurseScreen');
    const ui = document.getElementById('nurseUserInfo');
    if (ui) {
      ui.querySelector('strong').textContent = saved.name || '';
      ui.querySelector('span').textContent   = 'שלום, ' + (saved.name || '').split(' ')[0];
    }
    document.getElementById('nurseTitle').textContent = 'חלוקת תרופות';
    ghRead().then(remote => {
      if (remote) {
        if (remote.nurses)   data.nurses   = remote.nurses;
        if (remote.residents) data.residents = remote.residents;
        if (remote.meds)     data.meds      = remote.meds;
        if (remote.rounds)   data.rounds    = remote.rounds;
        if (remote.history)  data.history   = remote.history;
        if (remote.activeRoundSession !== undefined) data.activeRoundSession = remote.activeRoundSession;
        localStorage.setItem('medtrack_data', JSON.stringify(data));
      }
      nurseTab('round');
    }).catch(() => nurseTab('round'));
    startSync();
    setTimeout(() => scheduleRoundNotifications(), 2000);
  }
})();

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      // updateViaCache:'none' = browser never caches sw.js itself
      const reg = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });

      // Check for new SW every 15 seconds
      setInterval(() => reg.update(), 15_000);

      // Also check on every tab focus / app resume
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') reg.update();
      });
      window.addEventListener('pageshow', e => { if (e.persisted) reg.update(); });

      // New SW found → activate immediately
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        sw.addEventListener('statechange', () => {
          if (sw.state === 'installed') sw.postMessage('skipWaiting');
        });
      });

      // SW took over → reload
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!reloading) { reloading = true; window.location.reload(); }
      });

    } catch(e) { console.warn('SW:', e); }
  });
}
</script>
